<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenOps - 赤字工事予測AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
        .container{max-width:800px;margin:0 auto;background:white;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3);overflow:hidden}
        .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px;text-align:center}
        .header h1{font-size:28px;margin-bottom:5px}.header p{font-size:14px;opacity:0.9}
        .content{padding:30px}
        .form-section{margin-bottom:30px;padding:20px;background:#f8f9fa;border-radius:8px;border-left:4px solid #667eea}
        .form-section h3{color:#667eea;margin-bottom:15px;font-size:16px}
        label{display:block;font-weight:600;margin-bottom:8px;color:#333;font-size:14px}
        input[type="number"],input[type="text"],textarea,input[type="file"]{width:100%;padding:12px;margin-bottom:15px;border:2px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit}
        input[type="file"]{padding:8px;cursor:pointer}
        textarea{resize:vertical;min-height:100px}
        input:focus,textarea:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,0.1)}
        .upload-preview{margin-top:10px;padding:15px;background:white;border-radius:6px;display:none}
        .upload-preview.show{display:block}
        .preview-img{max-width:200px;max-height:200px;border-radius:6px}
        .button-group{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
        button{flex:1;padding:14px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.3s;min-width:120px}
        .btn-analyze{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}
        .btn-analyze:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,0.3)}
        .btn-ocr{background:#28a745;color:white}
        .btn-ocr:hover{background:#218838}
        .btn-ocr:disabled,.btn-analyze:disabled{background:#ccc;cursor:not-allowed;transform:none;box-shadow:none}
        .btn-export{background:#f0f0f0;color:#333;padding:10px 15px;font-size:13px}
        .btn-export:hover{background:#e0e0e0}
        .results{margin-top:30px;padding:20px;background:#f0f7ff;border-radius:8px;border-left:4px solid #28a745;display:none}
        .results.show{display:block}
        .result-item{margin-bottom:15px;padding:12px;background:white;border-radius:6px;font-size:14px}
        .result-item strong{color:#667eea}
        .risk-high{color:#dc3545;font-weight:bold}.risk-warn{color:#fd7e14;font-weight:bold}.risk-safe{color:#28a745;font-weight:bold}
        .loading{text-align:center;color:#666}
        .spinner{border:4px solid #f3f3f3;border-top:4px solid #667eea;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .tabs{display:flex;margin-bottom:20px;gap:10px}
        .tab-btn{padding:10px 20px;background:#e9ecef;border:none;border-radius:6px;cursor:pointer;font-weight:600;flex:1;font-size:14px}
        .tab-btn.active{background:#667eea;color:white}
        .tab-content{display:none}.tab-content.active{display:block}
        .error{padding:15px;background:#f8d7da;border:1px solid #f5c6cb;border-radius:6px;color:#721c24;margin-bottom:15px}
        @media(max-width:640px){.button-group{flex-direction:column}}
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>GreenOps AI 分析エンジン</h1><p>赤字工事を予測し、対応案を自動生成</p></div>
        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('manual',this)">手動入力</button>
                <button class="tab-btn" onclick="switchTab('ocr',this)">画像OCR</button>
            </div>

            <div id="manual" class="tab-content active">
                <div class="form-section">
                    <h3>工事情報を入力</h3>
                    <label>契約額（円）</label>
                    <input type="number" id="contractAmount" placeholder="例: 5000000" step="100000" min="0">
                    <label>予定工期（日数）</label>
                    <input type="number" id="scheduledDays" placeholder="例: 30" step="1" min="1">
                    <label>最新の日報（内容を自由に記述）</label>
                    <textarea id="dailyReport" placeholder="例: 7月15日の進捗：躯体工事が予定より3日遅延。資材納期が遅れたため。労務単価が前月比15%上昇。"></textarea>
                </div>
                <div class="button-group"><button class="btn-analyze" onclick="analyzeProject()">分析を実行</button></div>
            </div>

            <div id="ocr" class="tab-content">
                <div class="form-section">
                    <h3>写真から日報を自動抽出</h3>
                    <label>現場写真または日報画像</label>
                    <input type="file" id="imageFile" accept="image/*" onchange="previewImage()">
                    <div id="uploadPreview" class="upload-preview"><img id="previewImg" class="preview-img" src=""></div>
                    <div class="button-group"><button class="btn-ocr" id="ocrBtn" onclick="analyzeImage()">OCR実行（テキスト抽出）</button></div>
                </div>
                <div id="ocrResults"></div>
            </div>

            <div id="results" class="results">
                <h3 style="color:#667eea;margin-bottom:15px">AI分析結果</h3>
                <div id="analysisResults"></div>
                <div class="button-group" style="margin-top:20px">
                    <button class="btn-export" onclick="exportResults('json')">JSON出力</button>
                    <button class="btn-export" onclick="exportResults('csv')">CSV出力</button>
                    <button class="btn-export" onclick="exportResults('txt')">TXT出力</button>
                    <button class="btn-export" onclick="speakResults()">音声再生</button>
                </div>
            </div>
        </div>
    </div>
<script>
var lastAnalysis = null;

function switchTab(name, btn){
    document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.getElementById(name).classList.add('active');
    btn.classList.add('active');
}

function previewImage(){
    var file = document.getElementById('imageFile').files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
        document.getElementById('previewImg').src = e.target.result;
        document.getElementById('uploadPreview').classList.add('show');
    };
    reader.readAsDataURL(file);
}

function analyzeProject(){
    var contract = parseFloat(document.getElementById('contractAmount').value);
    var days = parseInt(document.getElementById('scheduledDays').value);
    var report = document.getElementById('dailyReport').value;
    if(!contract || !days || !report){ alert('全ての項目を入力してください'); return; }

    showLoading();
    fetch('/api/analyze-project', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            project_id: 'manual_input',
            project_data: {
                company: '手動入力',
                project_name: '手動入力プロジェクト',
                contract_amount: contract,
                duration_months: Math.ceil(days / 30),
                progress_rate: 50,
                cost_consumption_rate: 60,
                issues: report
            }
        })
    })
    .then(function(r){return r.json()})
    .then(function(data){
        if(data.error) throw new Error(data.error);
        lastAnalysis = data.ai_analysis;
        displayResults(data.ai_analysis);
    })
    .catch(function(err){showError('エラー: ' + err.message)});
}

function analyzeImage(){
    var file = document.getElementById('imageFile').files[0];
    if(!file){ alert('画像を選択してください'); return; }
    var btn = document.getElementById('ocrBtn');
    btn.disabled = true; btn.textContent = '処理中...';

    var reader = new FileReader();
    reader.onload = function(e){
        var base64 = e.target.result.split(',')[1];
        fetch('/api/analyze-image', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ image_base64: base64, image_type: file.type })
        })
        .then(function(r){return r.json()})
        .then(function(data){
            if(data.error) throw new Error(data.error);
            document.getElementById('ocrResults').innerHTML = '<div class="form-section"><h3>抽出テキスト</h3><div style="padding:12px;background:white;border-radius:6px;font-size:14px;line-height:1.6">' + (data.extracted_text||'').replace(/\n/g,'<br>') + '</div></div>';
            if(data.extracted_text){
                document.getElementById('dailyReport').value = data.extracted_text;
                switchTab('manual', document.querySelector('.tab-btn'));
            }
        })
        .catch(function(err){showError('OCRエラー: ' + err.message)})
        .finally(function(){btn.disabled = false; btn.textContent = 'OCR実行（テキスト抽出）'});
    };
    reader.readAsDataURL(file);
}

function displayResults(a){
    var c = a.cost || {};
    var s = a.schedule || {};
    var sf = a.safety || {};
    var lp = (c.loss_probability || 0); if(lp <= 1) lp = lp * 100;
    var cls = lp > 60 ? 'risk-high' : lp > 30 ? 'risk-warn' : 'risk-safe';
    var html = '<div class="result-item"><strong>赤字化確率:</strong> <span class="'+cls+'">'+lp.toFixed(1)+'%</span></div>';
    html += '<div class="result-item"><strong>推定赤字額:</strong> <span class="risk-high">\u00a5'+Math.floor(c.estimated_loss_yen||0).toLocaleString()+'</span></div>';
    html += '<div class="result-item"><strong>リスク判定:</strong> <span class="'+(c.severity==='CRITICAL'?'risk-high':c.severity==='WARNING'?'risk-warn':'risk-safe')+'">'+(c.severity||'SAFE')+'</span></div>';
    html += '<div class="result-item"><strong>工期遅延予測:</strong> <span class="risk-warn">'+(s.predicted_delay_days||0)+'\u65e5</span></div>';
    html += '<div class="result-item"><strong>安全スコア:</strong> <span class="risk-safe">'+(sf.overall_score||0)+'/100</span> ('+(sf.risk_level||'LOW')+')</div>';
    if(a.recommendations && a.recommendations.length > 0){
        html += '<div class="result-item"><strong style="display:block;margin-bottom:10px">推奨対応案</strong>';
        for(var i=0;i<a.recommendations.length;i++){
            html += '<div style="margin:8px 0;padding:8px;background:white;border-radius:4px;border-left:3px solid #667eea">'+(i+1)+'. '+a.recommendations[i]+'</div>';
        }
        html += '</div>';
    }
    document.getElementById('analysisResults').innerHTML = html;
    document.getElementById('results').classList.add('show');
    document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function showLoading(){
    document.getElementById('analysisResults').innerHTML = '<div class="loading"><div class="spinner"></div><p>AI分析中...</p></div>';
    document.getElementById('results').classList.add('show');
}

function showError(msg){
    document.getElementById('analysisResults').innerHTML = '<div class="error">'+msg+'</div>';
    document.getElementById('results').classList.add('show');
}

function exportResults(type){
    if(!lastAnalysis) return;
    var a = lastAnalysis;
    var c = a.cost||{};var s = a.schedule||{};var sf = a.safety||{};
    var lp = (c.loss_probability||0); if(lp<=1) lp=lp*100;
    var content, filename, mime;
    if(type==='json'){
        content = JSON.stringify({analysis:lastAnalysis,exported:new Date().toISOString()},null,2);
        filename = 'greenops-analysis.json'; mime = 'application/json';
    }else if(type==='csv'){
        content = '\u9805\u76ee,\u5024\n\u8d64\u5b57\u5316\u78ba\u7387,'+lp.toFixed(1)+'%\n\u63a8\u5b9a\u8d64\u5b57\u984d,\u00a5'+Math.floor(c.estimated_loss_yen||0)+'\n\u5de5\u671f\u9045\u5ef6,'+(s.predicted_delay_days||0)+'\u65e5\n\u5b89\u5168\u30b9\u30b3\u30a2,'+(sf.overall_score||0)+'/100';
        filename = 'greenops-analysis.csv'; mime = 'text/csv;charset=utf-8;';
    }else{
        content = 'GreenOps \u5206\u6790\u7d50\u679c\n\n\u8d64\u5b57\u5316\u78ba\u7387: '+lp.toFixed(1)+'%\n\u63a8\u5b9a\u8d64\u5b57\u984d: \u00a5'+Math.floor(c.estimated_loss_yen||0).toLocaleString()+'\n\u5de5\u671f\u9045\u5ef6: '+(s.predicted_delay_days||0)+'\u65e5\n\u5b89\u5168\u30b9\u30b3\u30a2: '+(sf.overall_score||0)+'/100\n\n\u63a8\u5968\u5bfe\u5fdc:\n'+(a.recommendations||[]).map(function(r,i){return(i+1)+'. '+r}).join('\n');
        filename = 'greenops-analysis.txt'; mime = 'text/plain;charset=utf-8;';
    }
    var blob = new Blob([content],{type:mime});
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
}

function speakResults(){
    if(!lastAnalysis) return;
    var a = lastAnalysis;var c = a.cost||{};var s = a.schedule||{};var sf = a.safety||{};
    var lp = (c.loss_probability||0); if(lp<=1) lp=lp*100;
    var text = '\u5206\u6790\u7d50\u679c\u3067\u3059\u3002\u8d64\u5b57\u5316\u78ba\u7387\u306f'+lp.toFixed(0)+'\u30d1\u30fc\u30bb\u30f3\u30c8\u3002\u63a8\u5b9a\u8d64\u5b57\u984d\u306f'+Math.floor(c.estimated_loss_yen||0).toLocaleString()+'\u5186\u3002\u5de5\u671f\u9045\u5ef6\u306f'+(s.predicted_delay_days||0)+'\u65e5\u3002\u5b89\u5168\u30b9\u30b3\u30a2\u306f'+(sf.overall_score||0)+'\u3067\u3059\u3002';
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    speechSynthesis.speak(u);
}
</script>
</body>
</html>
