<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenOps - 建設業向けSaaS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root{--primary:#0052cc;--success:#2da44e;--warning:#b08500;--danger:#d1242f;--bg:#ffffff;--bg-secondary:#f6f8fb;--text:#0a0e27;--text-secondary:#57606a;--border:#d0d7de}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-secondary);color:var(--text)}
        header{background:linear-gradient(135deg,var(--primary) 0%,#0066ff 100%);color:white;padding:16px 24px;position:sticky;top:0;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.12);display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:24px;font-weight:800}
        .user-info{font-size:12px}
        main{max-width:1400px;margin:0 auto;padding:32px 24px}
        .alert{background:#f0fdf4;border:1px solid var(--success);border-left:4px solid var(--success);padding:16px;border-radius:8px;margin-bottom:24px;color:#15803d;font-size:13px}
        .tabs{display:flex;gap:8px;margin-bottom:24px;background:white;padding:12px;border-radius:12px;flex-wrap:wrap}
        .tab-btn{padding:10px 20px;border:none;background:var(--bg-secondary);border-radius:6px;font-weight:600;cursor:pointer;transition:all 200ms;font-size:13px}
        .tab-btn.active{background:var(--primary);color:white}
        .tab-content{display:none}.tab-content.active{display:block}
        .form-card{background:white;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
        .form-card h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--primary)}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
        .form-group{margin-bottom:16px}
        label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--text-secondary)}
        input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
        textarea{resize:vertical;min-height:80px}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,82,204,0.1)}
        button{padding:12px 24px;border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;background:var(--primary);color:white;transition:all 200ms}
        button:hover{background:#003d99}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:24px}
        .card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-left:4px solid var(--primary)}
        .card.success{border-left-color:var(--success)}.card.warning{border-left-color:var(--warning)}.card.danger{border-left-color:var(--danger)}
        .metric-label{font-size:12px;text-transform:uppercase;font-weight:700;color:var(--text-secondary);margin-bottom:8px}
        .metric-value{font-size:32px;font-weight:800;color:var(--text);margin-bottom:8px}
        .metric-detail{font-size:13px;color:var(--text-secondary)}
        table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
        thead{background:var(--bg-secondary)}
        th{padding:12px;text-align:left;font-weight:700;font-size:12px;text-transform:uppercase;border-bottom:2px solid var(--border)}
        td{padding:12px;border-bottom:1px solid var(--border);font-size:13px}
        tbody tr:hover{background:var(--bg-secondary)}
        .success-msg{background:#f0fdf4;border:1px solid var(--success);border-left:4px solid var(--success);padding:12px;border-radius:6px;color:#15803d;font-size:13px;margin-top:16px}
        .error-msg{background:#fff0f1;border:1px solid var(--danger);border-left:4px solid var(--danger);padding:12px;border-radius:6px;color:#6e40aa;font-size:13px;margin-top:16px}
        @media(max-width:640px){main{padding:16px 12px}.form-grid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<header>
    <div class="logo">GreenOps</div>
    <div class="user-info">建設業向けSaaS | 日報→原価→給与完全自動化</div>
</header>
<main>
<div class="alert">ログイン成功 | 14日間無料トライアル中 | すべての機能が利用可能です</div>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('report',this)">日報入力</button>
    <button class="tab-btn" onclick="switchTab('cost',this)">原価管理</button>
    <button class="tab-btn" onclick="switchTab('payroll',this)">給与計算</button>
    <button class="tab-btn" onclick="switchTab('dashboard',this)">ダッシュボード</button>
    <button class="tab-btn" onclick="switchTab('history',this)">入力履歴</button>
</div>

<div id="report" class="tab-content active">
    <div class="form-card">
        <h3>本日の日報を入力</h3>
        <div class="form-grid">
            <div class="form-group"><label>工事名</label><select id="report-project"><option value="">選択...</option><option value="渋谷再開発A棟">渋谷再開発A棟</option><option value="横浜港湾施設">横浜港湾施設</option><option value="東京駅リノベ">東京駅リノベ</option></select></div>
            <div class="form-group"><label>工種</label><select id="report-worktype"><option value="">選択...</option><option value="鉄骨建方">鉄骨建方</option><option value="型枠組立">型枠組立</option><option value="コンクリート打設">コンクリート打設</option><option value="その他">その他</option></select></div>
            <div class="form-group"><label>作業人員（人）</label><input type="number" id="report-workers" value="12"></div>
            <div class="form-group"><label>稼働時間（h）</label><input type="number" id="report-hours" value="8"></div>
        </div>
        <div class="form-group"><label>特記事項</label><textarea id="report-notes" placeholder="資材遅延、天候悪化など..."></textarea></div>
        <button onclick="submitReport()">日報を送信</button>
        <div id="report-result"></div>
    </div>
</div>

<div id="cost" class="tab-content">
    <div class="form-card">
        <h3>月末原価を計算</h3>
        <div class="form-grid">
            <div class="form-group"><label>工事名</label><select id="cost-project"><option value="">選択...</option><option value="渋谷再開発A棟">渋谷再開発A棟</option><option value="横浜港湾施設">横浜港湾施設</option><option value="東京駅リノベ">東京駅リノベ</option></select></div>
            <div class="form-group"><label>予算額（万円）</label><input type="number" id="cost-budget" value="2500"></div>
            <div class="form-group"><label>実績額（万円）</label><input type="number" id="cost-actual" value="2400"></div>
        </div>
        <button onclick="calculateCost()">原価を計算・AI判定</button>
        <div id="cost-result"></div>
    </div>
    <div class="grid" id="cost-summary"></div>
</div>

<div id="payroll" class="tab-content">
    <div class="form-card">
        <h3>給与計算データを生成</h3>
        <div class="form-grid">
            <div class="form-group"><label>対象月</label><input type="month" id="payroll-month"></div>
            <div class="form-group"><label>従業員数</label><input type="number" id="payroll-employees" value="10"></div>
            <div class="form-group"><label>時給（円）</label><input type="number" id="payroll-hourly" value="3000"></div>
            <div class="form-group"><label>通常勤務時間</label><input type="number" id="payroll-hours" value="160"></div>
        </div>
        <button onclick="generatePayroll()">給与データを生成</button>
        <div id="payroll-result"></div>
    </div>
    <div class="grid" id="payroll-summary"></div>
</div>

<div id="dashboard" class="tab-content">
    <div class="grid">
        <div class="card success"><div class="metric-label">本月削減時間</div><div class="metric-value" id="dash-time">0h</div><div class="metric-detail">自動化による削減</div></div>
        <div class="card success"><div class="metric-label">削減金額</div><div class="metric-value" id="dash-money">&yen;0</div><div class="metric-detail">時給&yen;3,000換算</div></div>
        <div class="card success"><div class="metric-label">ROI</div><div class="metric-value" id="dash-roi">0%</div><div class="metric-detail">月額&yen;29,800対比</div></div>
    </div>
    <div class="form-card"><h3>削減効果の推移</h3><canvas id="dashboard-chart"></canvas></div>
</div>

<div id="history" class="tab-content">
    <div class="form-card">
        <h3>過去の入力データ</h3>
        <table id="history-table">
            <thead><tr><th>日付</th><th>工事名</th><th>工種</th><th>人員</th><th>時間</th><th>操作</th></tr></thead>
            <tbody><tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-secondary)">データはありません。日報を入力してください。</td></tr></tbody>
        </table>
    </div>
</div>
</main>

<script>
document.getElementById('payroll-month').value = new Date().toISOString().slice(0,7);

var allData = JSON.parse(localStorage.getItem('greenops_data') || '{"reports":[],"costs":[],"payrolls":[]}');

function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.getElementById(name).classList.add('active');
    btn.classList.add('active');
    if(name==='history') loadHistory();
    if(name==='dashboard') updateDashboard();
}

function submitReport() {
    var project = document.getElementById('report-project').value;
    var worktype = document.getElementById('report-worktype').value;
    var workers = parseInt(document.getElementById('report-workers').value) || 0;
    var hours = parseInt(document.getElementById('report-hours').value) || 0;
    var notes = document.getElementById('report-notes').value;
    if(!project || !worktype || !workers || !hours) {
        document.getElementById('report-result').innerHTML = '<div class="error-msg">すべての項目を入力してください</div>';
        return;
    }
    allData.reports.push({id:Date.now(), date:new Date().toISOString().split('T')[0], project:project, worktype:worktype, workers:workers, hours:hours, notes:notes, cost:workers*hours*3000});
    localStorage.setItem('greenops_data', JSON.stringify(allData));
    document.getElementById('report-result').innerHTML = '<div class="success-msg">日報を送信しました。工事台帳に自動転記されました。</div>';
}

function calculateCost() {
    var project = document.getElementById('cost-project').value;
    var budget = parseFloat(document.getElementById('cost-budget').value) || 0;
    var actual = parseFloat(document.getElementById('cost-actual').value) || 0;
    if(!project || !budget || !actual) {
        document.getElementById('cost-result').innerHTML = '<div class="error-msg">すべての項目を入力してください</div>';
        return;
    }
    var rate = (actual / budget * 100).toFixed(1);
    var status = '安全', cls = 'success';
    if(rate > 100) { status = '警告'; cls = 'warning'; }
    if(rate > 110) { status = '危険'; cls = 'danger'; }
    allData.costs.push({id:Date.now(), date:new Date().toISOString().split('T')[0], project:project, budget:budget, actual:actual, rate:rate});
    localStorage.setItem('greenops_data', JSON.stringify(allData));
    document.getElementById('cost-result').innerHTML = '<div class="success-msg">原価計算完了 | 消化率: ' + rate + '% | AI判定: ' + status + '</div>';
    document.getElementById('cost-summary').innerHTML = '<div class="card ' + cls + '"><div class="metric-label">消化率</div><div class="metric-value">' + rate + '%</div><div class="metric-detail">' + status + '</div></div><div class="card success"><div class="metric-label">予算残</div><div class="metric-value">&yen;' + (budget - actual).toFixed(1) + '\u4e07</div><div class="metric-detail">' + ((budget - actual) / budget * 100).toFixed(1) + '%\u4f59\u88d5</div></div>';
}

function generatePayroll() {
    var month = document.getElementById('payroll-month').value;
    var employees = parseInt(document.getElementById('payroll-employees').value) || 1;
    var hourly = parseInt(document.getElementById('payroll-hourly').value) || 3000;
    var hours = parseInt(document.getElementById('payroll-hours').value) || 160;
    if(!month) { document.getElementById('payroll-result').innerHTML = '<div class="error-msg">対象月を選択してください</div>'; return; }
    var baseH = Math.min(hours, 160), otH = Math.max(0, hours - 160);
    var base = baseH * hourly * employees, ot = otH * hourly * 1.25 * employees, allow = 50000 * employees;
    var total = base + ot + allow;
    allData.payrolls.push({id:Date.now(), month:month, employees:employees, total:total});
    localStorage.setItem('greenops_data', JSON.stringify(allData));
    document.getElementById('payroll-result').innerHTML = '<div class="success-msg">給与計算完了 | 月給計: &yen;' + (total / 10000).toFixed(1) + '\u4e07 | freee/弥生へ送信準備完了</div>';
    document.getElementById('payroll-summary').innerHTML = '<div class="card"><div class="metric-label">基本給</div><div class="metric-value">&yen;' + (base / 10000).toFixed(1) + '\u4e07</div><div class="metric-detail">' + employees + '\u540d x ' + baseH + 'h</div></div><div class="card"><div class="metric-label">残業代</div><div class="metric-value">&yen;' + (ot / 10000).toFixed(1) + '\u4e07</div><div class="metric-detail">' + otH + 'h x 1.25\u500d</div></div><div class="card success"><div class="metric-label">月給計</div><div class="metric-value">&yen;' + (total / 10000).toFixed(1) + '\u4e07</div><div class="metric-detail">自動計算完了</div></div>';
}

function loadHistory() {
    var tbody = document.querySelector('#history-table tbody');
    if(allData.reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-secondary)">データはありません。</td></tr>';
        return;
    }
    var html = '';
    for(var i = allData.reports.length - 1; i >= 0; i--) {
        var r = allData.reports[i];
        html += '<tr><td>' + r.date + '</td><td><strong>' + r.project + '</strong></td><td>' + r.worktype + '</td><td>' + r.workers + '\u4eba</td><td>' + r.hours + 'h</td><td><button onclick="deleteReport(' + r.id + ')" style="padding:6px 12px;font-size:11px">削除</button></td></tr>';
    }
    tbody.innerHTML = html;
}

function deleteReport(id) {
    allData.reports = allData.reports.filter(function(r){return r.id !== id});
    localStorage.setItem('greenops_data', JSON.stringify(allData));
    loadHistory();
}

var dashChart = null;
function updateDashboard() {
    var totalHours = 0;
    for(var i = 0; i < allData.reports.length; i++) totalHours += allData.reports[i].hours;
    var savedMoney = totalHours * 3000 * 0.5;
    var roi = savedMoney > 0 ? ((savedMoney - 29800) / 29800 * 100).toFixed(0) : 0;
    document.getElementById('dash-time').textContent = totalHours + 'h';
    document.getElementById('dash-money').textContent = '\u00a5' + (savedMoney / 10000).toFixed(1) + '\u4e07';
    document.getElementById('dash-roi').textContent = roi + '%';

    var ctx = document.getElementById('dashboard-chart');
    if(dashChart) dashChart.destroy();
    var hours = allData.reports.map(function(r){return r.hours});
    var labels = allData.reports.map(function(r){return r.date});
    if(hours.length === 0) { hours = [0]; labels = ['-']; }
    dashChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{label: '稼働時間(h)', data: hours, borderColor: '#0052cc', backgroundColor: 'rgba(0,82,204,0.1)', tension: 0.4, fill: true}]
        },
        options: {responsive: true, plugins: {legend: {display: true}}, scales: {y: {beginAtZero: true}}}
    });
}

updateDashboard();
</script>
</body>
</html>
