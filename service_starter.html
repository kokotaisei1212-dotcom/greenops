<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenOps - サービス</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#333}
        header{background:linear-gradient(135deg,#0052cc 0%,#0066ff 100%);color:white;padding:30px 20px;text-align:center}
        header h1{font-size:32px;font-weight:800;margin-bottom:5px}
        header p{font-size:14px;opacity:0.9}
        main{max-width:900px;margin:0 auto;padding:20px}
        .tabs{display:flex;gap:10px;margin-bottom:20px;background:white;padding:15px;border-radius:8px;flex-wrap:wrap}
        .tab-btn{padding:10px 20px;background:#f0f0f0;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;transition:all 200ms}
        .tab-btn.active{background:#0052cc;color:white}
        .tab-btn:hover{transform:translateY(-2px)}
        .tab-content{display:none}.tab-content.active{display:block}
        .form-card{background:white;padding:30px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .form-card h2{font-size:20px;font-weight:700;margin-bottom:20px;color:#0052cc}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
        .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#666}
        .form-group input,.form-group select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:#0052cc;box-shadow:0 0 0 3px rgba(0,82,204,0.1)}
        button{padding:12px 30px;background:#0052cc;color:white;border:none;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;transition:all 200ms}
        button:hover{background:#003d99;transform:translateY(-2px)}
        .result{background:#e8f5e9;border:1px solid #4caf50;border-left:4px solid #4caf50;padding:15px;border-radius:6px;margin-top:15px;font-size:14px;color:#2e7d32}
        .result.warning{background:#fff3e0;border-color:#ff9800;border-left-color:#ff9800;color:#e65100}
        .result.danger{background:#ffebee;border-color:#f44336;border-left-color:#f44336;color:#c62828}
        table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        th{background:#f5f5f5;padding:12px;text-align:left;font-weight:700;font-size:13px;border-bottom:2px solid #ddd}
        td{padding:12px;border-bottom:1px solid #eee;font-size:13px}
        tbody tr:hover{background:#f9f9f9}
        @media(max-width:640px){.form-grid{grid-template-columns:1fr}main{padding:12px}}
    </style>
</head>
<body>
<header>
    <h1>GreenOps</h1>
    <p>日報→給与自動化サービス（14日間無料トライアル中）</p>
</header>
<main>
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('report',this)">日報入力</button>
    <button class="tab-btn" onclick="switchTab('cost',this)">原価管理</button>
    <button class="tab-btn" onclick="switchTab('payroll',this)">給与計算</button>
    <button class="tab-btn" onclick="switchTab('export',this)">CSV出力</button>
    <button class="tab-btn" onclick="switchTab('list',this)">履歴</button>
</div>

<div id="report" class="tab-content active">
    <div class="form-card">
        <h2>本日の日報を入力</h2>
        <div class="form-grid">
            <div class="form-group"><label>工事ID</label><input type="text" id="r_proj" value="proj_001"></div>
            <div class="form-group"><label>工種</label><input type="text" id="r_work" value="鉄骨建方"></div>
            <div class="form-group"><label>作業人員（人）</label><input type="number" id="r_workers" value="10" min="1"></div>
            <div class="form-group"><label>作業時間（h）</label><input type="number" id="r_hours" value="8" min="0"></div>
        </div>
        <button onclick="addReport()">日報を送信</button>
        <div id="r_msg"></div>
    </div>
</div>

<div id="cost" class="tab-content">
    <div class="form-card">
        <h2>工事の原価を計算</h2>
        <div class="form-grid">
            <div class="form-group"><label>工事ID</label><input type="text" id="c_proj" value="proj_001"></div>
            <div class="form-group"><label>予算額（万円）</label><input type="number" id="c_budget" value="2500" min="0"></div>
            <div class="form-group"><label>実績額（万円）</label><input type="number" id="c_actual" value="2400" min="0"></div>
        </div>
        <button onclick="calcCost()">計算実行</button>
        <div id="c_msg"></div>
    </div>
</div>

<div id="payroll" class="tab-content">
    <div class="form-card">
        <h2>給与基礎データを生成</h2>
        <div class="form-grid">
            <div class="form-group"><label>従業員ID</label><input type="text" id="p_emp" value="emp_001"></div>
            <div class="form-group"><label>対象月</label><input type="month" id="p_month"></div>
            <div class="form-group"><label>時給（円）</label><input type="number" id="p_hourly" value="3000" min="0"></div>
            <div class="form-group"><label>合計工数（h）</label><input type="number" id="p_hours" value="160" min="0"></div>
        </div>
        <button onclick="genPayroll()">給与を生成</button>
        <div id="p_msg"></div>
    </div>
</div>

<div id="export" class="tab-content">
    <div class="form-card">
        <h2>会計ソフトへのエクスポート</h2>
        <div class="form-grid">
            <div class="form-group"><label>工事ID</label><input type="text" id="e_proj" value="proj_001"></div>
            <div class="form-group"><label>エクスポート形式</label><select id="e_format"><option value="freee">freee CSV</option><option value="yayoi">弥生 CSV</option></select></div>
        </div>
        <button onclick="exportCSV()">CSVをダウンロード</button>
        <div id="e_msg"></div>
    </div>
</div>

<div id="list" class="tab-content">
    <div class="form-card">
        <h2>日報入力履歴</h2>
        <table id="listTable">
            <thead><tr><th>日付</th><th>工事ID</th><th>工種</th><th>人員</th><th>時間</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
</main>

<script>
var data = JSON.parse(localStorage.getItem('greenops_data') || '{"reports":[]}');
document.getElementById('p_month').value = new Date().toISOString().slice(0,7);

function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.getElementById(name).classList.add('active');
    btn.classList.add('active');
    if(name === 'list') loadList();
}

function addReport() {
    var obj = {
        date: new Date().toISOString().split('T')[0],
        proj: document.getElementById('r_proj').value,
        work: document.getElementById('r_work').value,
        workers: parseInt(document.getElementById('r_workers').value) || 0,
        hours: parseInt(document.getElementById('r_hours').value) || 0
    };
    if(!obj.proj || !obj.work) {
        document.getElementById('r_msg').innerHTML = '<div class="result danger">工事IDと工種を入力してください</div>';
        return;
    }
    data.reports.push(obj);
    localStorage.setItem('greenops_data', JSON.stringify(data));
    document.getElementById('r_msg').innerHTML = '<div class="result">日報を保存しました</div>';
}

function calcCost() {
    var budget = parseFloat(document.getElementById('c_budget').value) || 0;
    var actual = parseFloat(document.getElementById('c_actual').value) || 0;
    if(budget === 0) { document.getElementById('c_msg').innerHTML = '<div class="result danger">予算額を入力してください</div>'; return; }
    var rate = (actual / budget * 100).toFixed(1);
    var cls = '', status = '安全';
    if(rate > 110) { cls = 'danger'; status = '危険'; }
    else if(rate > 100) { cls = 'warning'; status = '警告'; }
    document.getElementById('c_msg').innerHTML = '<div class="result ' + cls + '">消化率: <strong>' + rate + '%</strong> ' + status + '</div>';
}

function genPayroll() {
    var hourly = parseInt(document.getElementById('p_hourly').value) || 0;
    var hours = parseInt(document.getElementById('p_hours').value) || 0;
    var base = Math.min(hours, 160) * hourly;
    var ot = Math.max(0, hours - 160) * hourly * 1.25;
    var total = base + ot + 50000;
    document.getElementById('p_msg').innerHTML = '<div class="result"><strong>月給計算結果</strong><br>基本給: \u00a5' + (base/10000).toFixed(1) + '\u4e07<br>残業代: \u00a5' + (ot/10000).toFixed(1) + '\u4e07<br>手当: \u00a55\u4e07<br><strong>合計: \u00a5' + (total/10000).toFixed(1) + '\u4e07</strong></div>';
}

function exportCSV() {
    var format = document.getElementById('e_format').value;
    var csv;
    if(format === 'freee') {
        csv = '\u6458\u8981,\u501f\u65b9\u52d8\u5b9a\u79d1\u76ee,\u501f\u65b9\u91d1\u984d,\u8cb8\u65b9\u52d8\u5b9a\u79d1\u76ee,\u8cb8\u65b9\u91d1\u984d\n\u5de5\u4e8b\u58f2\u4e0a,\u58f2\u639b\u91d1,600000,\u58f2\u4e0a\u9ad8,600000\n\u5de5\u4e8b\u539f\u4fa1,\u5de5\u4e8b\u539f\u4fa1,500000,\u672a\u6255\u91d1,500000';
    } else {
        csv = '\u65e5\u4ed8,\u501f\u65b9,\u501f\u65b9\u91d1\u984d,\u8cb8\u65b9,\u8cb8\u65b9\u91d1\u984d\n2026-04-07,\u58f2\u639b\u91d1,600000,\u58f2\u4e0a,600000\n2026-04-07,\u5de5\u4e8b\u539f\u4fa1,500000,\u672a\u6255\u91d1,500000';
    }
    var blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'greenops_' + format + '.csv';
    a.click();
    document.getElementById('e_msg').innerHTML = '<div class="result">CSV\u3092\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u3057\u307e\u3057\u305f</div>';
}

function loadList() {
    var tbody = document.querySelector('#listTable tbody');
    if(data.reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:30px">\u65e5\u5831\u304c\u307e\u3060\u3042\u308a\u307e\u305b\u3093</td></tr>';
        return;
    }
    var html = '';
    for(var i = data.reports.length - 1; i >= 0; i--) {
        var r = data.reports[i];
        html += '<tr><td>' + r.date + '</td><td><strong>' + r.proj + '</strong></td><td>' + r.work + '</td><td>' + r.workers + '</td><td>' + r.hours + 'h</td></tr>';
    }
    tbody.innerHTML = html;
}
</script>
</body>
</html>
