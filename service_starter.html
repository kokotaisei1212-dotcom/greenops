<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenOps - ダッシュボード</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a}
        .header{background:#fff;border-bottom:1px solid #e0e0e0;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:20px;font-weight:700}
        .user-menu button{background:#f0f0f0;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px}
        .container{max-width:1400px;margin:0 auto;padding:40px}
        .setup-screen,.dashboard-screen{display:none}
        .setup-screen.active,.dashboard-screen.active{display:block}
        .setup-form{max-width:500px;margin:60px auto;background:#fff;padding:40px;border-radius:6px;border:1px solid #e0e0e0}
        .setup-form h2{font-size:28px;font-weight:700;margin-bottom:30px;text-align:center}
        .form-group{margin-bottom:20px}
        .form-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
        .form-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:4px;font-size:14px;font-family:inherit}
        .form-input:focus{outline:none;border-color:#000;box-shadow:0 0 0 2px rgba(0,0,0,0.05)}
        .btn{background:#000;color:#fff;border:none;padding:12px 24px;border-radius:4px;font-weight:600;cursor:pointer;width:100%;font-size:16px}
        .btn:hover{background:#333}
        .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
        .kpi-card{background:#fff;padding:30px;border-radius:6px;border:1px solid #e0e0e0}
        .kpi-label{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;font-weight:600}
        .kpi-value{font-size:32px;font-weight:700;margin-bottom:8px}
        .kpi-change{font-size:12px;color:#666}
        .green{color:#2ecc71}.red{color:#e74c3c}
        .main-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:40px}
        .card{background:#fff;border-radius:6px;border:1px solid #e0e0e0;padding:30px}
        .card-title{font-size:18px;font-weight:700;margin-bottom:25px}
        .alert-box{background:#fff3cd;border-left:4px solid #ffc107;padding:20px;border-radius:4px;margin-bottom:25px}
        .alert-title{font-weight:600;color:#856404;margin-bottom:8px}
        .alert-message{font-size:14px;color:#856404}
        .project-item{padding:20px;border:1px solid #f0f0f0;border-radius:4px;margin-bottom:15px}
        .project-header{display:flex;justify-content:space-between;margin-bottom:12px}
        .project-name{font-weight:600;font-size:16px}
        .project-status{font-size:12px;color:#999}
        .project-margin{font-size:18px;font-weight:700}
        .progress-bar{background:#f0f0f0;height:6px;border-radius:3px;overflow:hidden;margin:12px 0}
        .progress-fill{height:100%;background:#000;border-radius:3px}
        .daily-input-btn{background:#000;color:#fff;border:none;padding:14px 24px;border-radius:4px;font-weight:600;cursor:pointer;width:100%;margin-bottom:10px;font-size:14px}
        .daily-input-btn:hover{background:#333}
        .secondary-btn{background:#f5f5f5;color:#000;border:1px solid #ddd}
        .secondary-btn:hover{background:#efefef}
        .daily-form{background:#f9f9f9;padding:20px;border-radius:4px;margin-bottom:20px;display:none}
        .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:15px}
        .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .stat-item{background:#f9f9f9;padding:20px;border-radius:4px;border-left:3px solid #000}
        .stat-label{font-size:12px;color:#999;margin-bottom:8px}
        .stat-value{font-size:20px;font-weight:700}
        .trend-container{margin-top:20px;padding:20px;background:#f9f9f9;border-radius:4px}
        .trend-title{font-weight:600;margin-bottom:15px}
        .chart-bar{display:flex;gap:10px;align-items:flex-end;height:150px;margin-bottom:10px}
        .bar{flex:1;background:#000;border-radius:4px 4px 0 0}
        .bar-label{text-align:center;font-size:12px;color:#999;margin-top:10px}
        @media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}}
        @media(max-width:768px){.container{padding:20px}.header{padding:20px}.kpi-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">GreenOps</div>
        <div class="user-menu"><span id="userName" style="margin-right:20px"></span><button onclick="logout()">ログアウト</button></div>
    </div>
    <div class="container">
        <div class="setup-screen active" id="setupScreen">
            <div class="setup-form">
                <h2>工事を登録</h2>
                <div class="form-group"><label class="form-label">工事名</label><input type="text" class="form-input" id="projectName" placeholder="例: 〇〇邸リノベーション"></div>
                <div class="form-group"><label class="form-label">予算（万円）</label><input type="number" class="form-input" id="projectBudget" placeholder="例: 500"></div>
                <div class="form-group"><label class="form-label">工期（日数）</label><input type="number" class="form-input" id="projectDays" placeholder="例: 30"></div>
                <button class="btn" onclick="registerProject()">ダッシュボードを開始</button>
            </div>
        </div>
        <div class="dashboard-screen" id="dashboardScreen">
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">今月の粗利率</div><div class="kpi-value" id="marginRate">0%</div><div class="kpi-change" id="marginChange"></div></div>
                <div class="kpi-card"><div class="kpi-label">進行中の工事</div><div class="kpi-value" id="projectCount">1件</div><div class="kpi-change" id="redFlagCount"></div></div>
                <div class="kpi-card"><div class="kpi-label">赤字発見までの日数</div><div class="kpi-value" id="daysBefore">0日</div><div class="kpi-change">（従来 30日）</div></div>
                <div class="kpi-card"><div class="kpi-label">月間日報入力時間</div><div class="kpi-value" id="inputTime">0分</div><div class="kpi-change">（従来 60時間）</div></div>
            </div>
            <div class="main-grid">
                <div class="card">
                    <div class="card-title">進行中の工事</div>
                    <div id="alertContainer"></div>
                    <div id="projectsList"></div>
                </div>
                <div>
                    <div class="card" style="margin-bottom:20px">
                        <div class="card-title">本日の日報入力</div>
                        <button class="daily-input-btn" onclick="toggleDailyForm()">本日の日報を入力（37秒）</button>
                        <div class="daily-form" id="dailyForm">
                            <div class="form-group"><label class="form-label">人数</label><input type="number" class="form-input" id="dailyWorkers" placeholder="8"></div>
                            <div class="form-group"><label class="form-label">進捗（%）</label><input type="number" class="form-input" id="dailyProgress" placeholder="65" min="0" max="100"></div>
                            <div class="form-group"><label class="form-label">天候</label><select class="form-input" id="dailyWeather"><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div>
                            <div class="form-group"><label class="form-label">追加工事（万円）</label><input type="number" class="form-input" id="dailyExtra" placeholder="0"></div>
                            <button class="btn" onclick="saveDailyReport()">保存</button>
                        </div>
                        <button class="daily-input-btn secondary-btn" onclick="exportCSV()">CSVでエクスポート</button>
                    </div>
                    <div class="card">
                        <div class="card-title">データ同期</div>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-label">本日の日報</div><div class="stat-value" id="todayCount">0件</div></div>
                            <div class="stat-item"><div class="stat-label">累計日報</div><div class="stat-value" id="totalCount">0件</div></div>
                        </div>
                        <div class="trend-container"><div class="trend-title">7日間の粗利率</div><div class="chart-bar" id="trendChart"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
    var projects={},dailyReports={};

    function loadData(){var s=localStorage.getItem('greenops_data');if(s){var d=JSON.parse(s);projects=d.projects||{};dailyReports=d.reports||{}}}
    function saveData(){localStorage.setItem('greenops_data',JSON.stringify({projects:projects,reports:dailyReports}))}

    function registerProject(){
        var name=document.getElementById('projectName').value,budget=parseInt(document.getElementById('projectBudget').value),days=parseInt(document.getElementById('projectDays').value);
        if(!name||!budget||!days){alert('すべてのフィールドを入力してください');return}
        var id=Date.now().toString();
        projects[id]={id:id,name:name,budget:budget,days:days,startDate:new Date().toISOString()};
        document.getElementById('userName').textContent='ユーザー様';
        saveData();showDashboard();
    }

    function showDashboard(){document.getElementById('setupScreen').classList.remove('active');document.getElementById('dashboardScreen').classList.add('active');updateDashboard()}

    function toggleDailyForm(){var f=document.getElementById('dailyForm');f.style.display=f.style.display==='none'?'block':'none'}

    function saveDailyReport(){
        var pids=Object.keys(projects);if(pids.length===0){alert('工事を登録してください');return}
        var pid=pids[0],w=parseInt(document.getElementById('dailyWorkers').value)||0,p=parseInt(document.getElementById('dailyProgress').value)||0,wt=document.getElementById('dailyWeather').value,ex=parseInt(document.getElementById('dailyExtra').value)||0;
        var today=new Date().toISOString().split('T')[0];
        if(!dailyReports[pid])dailyReports[pid]={};
        dailyReports[pid][today]={workers:w,progress:p,weather:wt,extra:ex,date:today};
        saveData();document.getElementById('dailyForm').style.display='none';
        document.getElementById('dailyWorkers').value='';document.getElementById('dailyProgress').value='';document.getElementById('dailyExtra').value='';
        updateDashboard();alert('日報を保存しました。粗利が更新されます。');
    }

    function updateDashboard(){
        var pids=Object.keys(projects);if(pids.length===0)return;
        var pid=pids[0],proj=projects[pid],reps=dailyReports[pid]||{};
        var repKeys=Object.keys(reps),totalReps=repKeys.length;
        var avgProg=totalReps>0?Object.values(reps).reduce(function(s,r){return s+r.progress},0)/totalReps:0;
        var spend=proj.budget*(avgProg/100),margin=proj.budget-spend,mRate=((margin/proj.budget)*100).toFixed(1);

        document.getElementById('marginRate').textContent=mRate+'%';
        document.getElementById('marginChange').innerHTML=margin>=0?'<span class="green">安全</span>':'<span class="red">危険</span>';
        document.getElementById('projectCount').textContent=pids.length+'件';
        document.getElementById('redFlagCount').innerHTML=margin<0?'赤字 <span class="red">1件</span>':'<span class="green">正常</span>';
        document.getElementById('daysBefore').textContent=(proj.days-22)+'日';
        document.getElementById('inputTime').textContent=(totalReps*37/60).toFixed(0)+'分';
        document.getElementById('totalCount').textContent=totalReps+'件';
        var today=new Date().toISOString().split('T')[0];
        document.getElementById('todayCount').textContent=(reps[today]?'1':'0')+'件';

        var html='';
        pids.forEach(function(id){
            var p=projects[id],r=dailyReports[id]||{},rk=Object.keys(r);
            var ap=rk.length>0?(Object.values(r).reduce(function(s,rr){return s+rr.progress},0)/rk.length).toFixed(0):0;
            var sp=p.budget*(ap/100),m=p.budget-sp;
            html+='<div class="project-item"><div class="project-header"><div><div class="project-name">'+p.name+'</div><div class="project-status">進捗 '+ap+'% | 入力数 '+rk.length+'件</div></div><div class="project-margin '+(m>=0?'green':'red')+'">'+(m>=0?'+':'')+m.toFixed(0)+'万</div></div><div class="progress-bar"><div class="progress-fill" style="width:'+ap+'%;background:'+(m>=0?'#000':'#e74c3c')+'"></div></div><div style="font-size:12px;color:#666">予算 '+p.budget+'万 | 見込支出 '+sp.toFixed(0)+'万 | 粗利率 '+((m/p.budget)*100).toFixed(1)+'%</div></div>';
        });
        document.getElementById('alertContainer').innerHTML=margin<0?'<div class="alert-box"><div class="alert-title">要確認</div><div class="alert-message">'+proj.name+'：赤字予兆。職人人数または工期の見直しを検討</div></div>':'';
        document.getElementById('projectsList').innerHTML=html;

        var trendHTML='';
        for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var ds=d.toISOString().split('T')[0];var rep=reps[ds];var h=rep?(rep.progress*1.5):30;var dn=d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'});
        trendHTML+='<div style="flex:1;position:relative"><div class="bar" style="height:'+h+'px"></div><div class="bar-label">'+dn+'</div></div>';}
        document.getElementById('trendChart').innerHTML=trendHTML;
    }

    function exportCSV(){
        var pids=Object.keys(projects);if(pids.length===0){alert('データがありません');return}
        var pid=pids[0],proj=projects[pid],reps=dailyReports[pid]||{};
        var csv='\u65e5\u4ed8,\u4eba\u6570,\u9032\u6357,\u5929\u5019,\u8ffd\u52a0\u5de5\u4e8b\n';
        Object.entries(reps).forEach(function(e){var d=e[0],r=e[1];csv+=d+','+r.workers+','+r.progress+','+r.weather+','+r.extra+'\n'});
        var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=proj.name+'_\u65e5\u5831.csv';a.click();
    }

    function logout(){if(confirm('\u30ed\u30b0\u30a2\u30a6\u30c8\u3057\u307e\u3059\u304b\uff1f')){localStorage.removeItem('greenops_data');window.location.href='/'}}

    loadData();if(Object.keys(projects).length>0)showDashboard();
    </script>
</body>
</html>
