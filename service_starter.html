<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ゲンバノメ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#ffffff;color:#1a1a1a;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
.screen{display:none;width:100%;height:100%;flex-direction:column}
.screen.active{display:flex}
.setup{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;background:linear-gradient(135deg,#ffffff 0%,#fafafa 100%)}
.setup-logo{font-size:64px;margin-bottom:40px}
.setup-title{font-size:32px;font-weight:700;margin-bottom:12px;text-align:center}
.setup-desc{font-size:14px;color:#999;text-align:center;margin-bottom:48px;line-height:1.6}
.setup-form{width:100%;max-width:320px}
.setup-input{width:100%;padding:14px 16px;margin-bottom:12px;border:1px solid #e5e5e5;border-radius:8px;font-size:16px;font-family:inherit;background:white}
.setup-input:focus{outline:none;border-color:#ff6b35;box-shadow:0 0 0 3px rgba(255,107,53,0.08)}
.setup-btn{width:100%;padding:16px;margin-top:24px;background:#ff6b35;color:white;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
.setup-btn:active{background:#f7931e}
.dashboard{flex:1;display:flex;flex-direction:column;background:#ffffff;overflow:hidden}
.dashboard-header{padding:24px;text-align:center;border-bottom:1px solid #f0f0f0}
.dashboard-title{font-size:14px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.dashboard-project{font-size:18px;font-weight:700;color:#1a1a1a}
.dashboard-content{flex:1;display:flex;flex-direction:column;padding:32px 24px;overflow-y:auto;justify-content:center;align-items:center}
.profit-display{text-align:center;margin-bottom:40px}
.profit-label{font-size:12px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px}
.profit-number{font-size:72px;font-weight:700;line-height:1;margin-bottom:16px}
.profit-number.ok{color:#10b981}.profit-number.warning{color:#f59e0b}.profit-number.danger{color:#ef4444}
.status-light{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#f5f5f5;border-radius:20px;font-size:13px;font-weight:600}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.ok{background:#10b981}.status-dot.warning{background:#f59e0b}.status-dot.danger{background:#ef4444}
.reason-box{background:#f9f9f9;padding:20px;border-radius:12px;margin-bottom:32px;text-align:left;max-width:360px;line-height:1.7;font-size:13px;color:#666}
.reason-title{font-weight:700;color:#1a1a1a;margin-bottom:8px;font-size:14px}
.dashboard-actions{display:flex;gap:12px;width:100%;max-width:360px}
.btn{flex:1;padding:14px 20px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#ff6b35;color:white}
.btn-primary:active{background:#f7931e;transform:scale(0.98)}
.btn-secondary{background:#f5f5f5;color:#1a1a1a}
.btn-secondary:active{background:#ebebeb;transform:scale(0.98)}
.report{flex:1;display:flex;flex-direction:column;padding:20px 24px;overflow-y:auto;background:#ffffff}
.report-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid #f0f0f0}
.report-title{font-size:18px;font-weight:700}
.report-close{background:none;border:none;font-size:24px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.report-item{margin-bottom:32px}
.report-label{font-size:13px;font-weight:700;margin-bottom:16px;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px}
.worker-control{display:flex;align-items:center;justify-content:center;gap:20px}
.worker-btn{width:52px;height:52px;border-radius:8px;border:2px solid #e5e5e5;background:white;font-size:24px;font-weight:700;cursor:pointer}
.worker-btn:active{background:#f5f5f5;border-color:#ff6b35}
.worker-display{font-size:48px;font-weight:700;color:#ff6b35;min-width:80px;text-align:center}
input[type="range"]{width:100%;height:6px;border-radius:3px;background:#e5e5e5;outline:none;-webkit-appearance:none}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#ff6b35;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.progress-display{text-align:center;font-size:32px;font-weight:700;color:#ff6b35;margin-top:12px}
.weather-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.weather-btn{aspect-ratio:1;border:2px solid #e5e5e5;background:white;border-radius:8px;font-size:32px;cursor:pointer}
.weather-btn.selected{border-color:#ff6b35;background:rgba(255,107,53,0.08)}
.weather-btn:active{transform:scale(0.9)}
.toggle-group{display:flex;gap:12px}
.toggle-btn{flex:1;padding:12px;border:2px solid #e5e5e5;background:white;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.toggle-btn.active{border-color:#ff6b35;background:#ff6b35;color:white}
.amount-input{width:100%;padding:12px;border:2px solid #e5e5e5;border-radius:6px;font-size:16px;display:none;margin-top:12px;font-family:inherit}
.amount-input.show{display:block}
.amount-input:focus{outline:none;border-color:#ff6b35}
textarea{width:100%;padding:12px;border:2px solid #e5e5e5;border-radius:6px;font-size:14px;font-family:inherit;resize:none;min-height:80px}
textarea:focus{outline:none;border-color:#ff6b35}
.report-actions{display:flex;gap:12px;margin-top:32px;padding-bottom:20px}
.btn-submit{flex:1;padding:16px;background:#ff6b35;color:white;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
.btn-cancel{flex:1;padding:16px;background:#f5f5f5;color:#1a1a1a;border:none;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
.detail{flex:1;display:flex;flex-direction:column;padding:20px 24px;overflow-y:auto;background:#ffffff}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #f0f0f0}
.detail-title{font-size:18px;font-weight:700}
.chart-section{margin-bottom:32px}
.chart-label{font-size:13px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.chart-container{background:#f9f9f9;padding:16px;border-radius:8px;height:200px;position:relative}
.report-table{width:100%;margin-top:12px}
.report-table-row{display:grid;grid-template-columns:60px 1fr 1fr 1fr;gap:8px;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.report-table-row:first-child{font-weight:700;color:#999;border-bottom:2px solid #e5e5e5}
.download-btn{width:100%;padding:14px;background:#f5f5f5;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:20px}
</style>
</head>
<body>
<div id="setupScreen" class="screen active">
<div class="setup">
<div class="setup-logo">&#x1F441;</div>
<div class="setup-title">ゲンバノメ</div>
<div class="setup-desc">工事の粗利が毎日見える<br>赤字に気づくのが3週間早くなる</div>
<div class="setup-form">
<input type="text" class="setup-input" id="setupName" placeholder="工事名">
<input type="number" class="setup-input" id="setupBudget" placeholder="予算（万円）">
<input type="number" class="setup-input" id="setupDays" placeholder="工期（日）">
<button class="setup-btn" onclick="startProject()">はじめる</button>
</div>
</div>
</div>

<div id="dashboardScreen" class="screen">
<div class="dashboard-header"><div class="dashboard-title">Today</div><div class="dashboard-project" id="dashboardProjectName">工事名</div></div>
<div class="dashboard-content">
<div class="profit-display">
<div class="profit-label">推定粗利</div>
<div class="profit-number ok" id="profitNumber">&yen;0万</div>
<div class="status-light" id="statusLight"><div class="status-dot ok"></div><span id="statusText">計画通り</span></div>
</div>
<div class="reason-box" id="reasonBox"><div class="reason-title">現在の状態</div><div id="reasonText">CPI 100%、工期も計画通りです</div></div>
<div class="dashboard-actions">
<button class="btn btn-primary" onclick="goToReport()">日報を入力</button>
<button class="btn btn-secondary" onclick="goToDetail()">詳細</button>
</div>
<div style="margin-top:32px;text-align:center"><button style="background:none;border:none;color:#999;cursor:pointer;font-size:12px" onclick="changeProject()">工事を変更</button></div>
</div>
</div>

<div id="reportScreen" class="screen">
<div class="report">
<div class="report-header"><div class="report-title">日報</div><button class="report-close" onclick="goToDashboard()">&times;</button></div>
<div class="report-item"><div class="report-label">今日の人数</div><div class="worker-control"><button class="worker-btn" onclick="adjustWorkers(-1)">&minus;</button><div class="worker-display" id="workerDisplay">0</div><button class="worker-btn" onclick="adjustWorkers(1)">+</button></div></div>
<div class="report-item"><div class="report-label">進捗率</div><input type="range" id="progressSlider" min="0" max="100" value="0" oninput="updateProgress()"><div class="progress-display" id="progressDisplay">0%</div></div>
<div class="report-item"><div class="report-label">天候</div><div class="weather-grid"><button class="weather-btn" onclick="selectWeather(this,'sunny')">&#x2600;</button><button class="weather-btn" onclick="selectWeather(this,'cloudy')">&#x2601;</button><button class="weather-btn" onclick="selectWeather(this,'rain')">&#x1F327;</button><button class="weather-btn" onclick="selectWeather(this,'snow')">&#x2744;</button><button class="weather-btn" onclick="selectWeather(this,'stop')">&#x1F6AB;</button></div></div>
<div class="report-item"><div class="report-label">追加工事</div><div class="toggle-group"><button class="toggle-btn active" onclick="toggleChanges(this,false)">なし</button><button class="toggle-btn" onclick="toggleChanges(this,true)">あり</button></div><input type="number" class="amount-input" id="changesAmount" placeholder="金額（万円）"></div>
<div class="report-item"><div class="report-label">メモ</div><textarea id="memo" placeholder="現場の気づき・課題"></textarea></div>
<div class="report-actions"><button class="btn-submit" onclick="submitReport()">送信</button><button class="btn-cancel" onclick="goToDashboard()">キャンセル</button></div>
</div>
</div>

<div id="detailScreen" class="screen">
<div class="detail">
<div class="detail-header"><div class="detail-title">詳細分析</div><button class="report-close" onclick="goToDashboard()">&times;</button></div>
<div class="chart-section"><div class="chart-label">進捗トレンド</div><div class="chart-container"><canvas id="scurveCanvas"></canvas></div></div>
<div class="chart-section"><div class="chart-label">直近7日の日報</div><div class="report-table" id="reportTable"></div></div>
<button class="download-btn" onclick="downloadCSV()">CSVダウンロード</button>
<div style="display:flex;gap:12px;margin-bottom:20px"><button class="btn btn-secondary" style="flex:1" onclick="resetData()">データリセット</button></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
var project=null,currentWorkers=0,currentWeather=null,currentChanges=false;

function startProject(){
  var n=document.getElementById('setupName').value,b=parseInt(document.getElementById('setupBudget').value),d=parseInt(document.getElementById('setupDays').value);
  if(!n||!b||!d){alert('すべて入力してください');return}
  project={name:n,budget:b*10000,days:d,startDate:new Date().toISOString(),reports:[]};
  localStorage.setItem('genbanome_project',JSON.stringify(project));
  showScreen('dashboardScreen');renderDashboard();
}

function calculateMetrics(){
  if(!project||!project.reports.length) return{profit:0,cpi:1.0,progress:0,status:'ok',message:'CPI 100%、工期も計画通りです'};
  var tc=project.reports.reduce(function(s,r){return s+(r.workers*12000)},0);
  var ch=project.reports.reduce(function(s,r){return s+(r.hasChanges?r.changesAmount:0)},0);
  var ac=tc+ch,pc=project.budget*0.6,lp=project.reports[project.reports.length-1].progress/100;
  var ev=pc*lp,cpi=ac>0?ev/ac:1.0,profit=Math.max(0,project.budget*0.4*cpi);
  var status='ok',msg='CPI '+Math.round(cpi*100)+'%、進捗率 '+Math.round(lp*100)+'%';
  if(cpi<0.85){status='danger';msg='赤字リスク！即対応が必要です'}
  else if(cpi<0.95){status='warning';msg='要注意：このペースだと赤字転落'}
  return{profit:Math.round(profit),cpi:cpi,progress:lp*100,status:status,message:msg};
}

function renderDashboard(){
  var m=calculateMetrics(),pm=m.profit/10000;
  document.getElementById('dashboardProjectName').textContent=project.name;
  document.getElementById('profitNumber').className='profit-number '+m.status;
  document.getElementById('profitNumber').textContent='\u00a5'+pm.toFixed(1)+'\u4e07';
  document.getElementById('statusLight').querySelector('.status-dot').className='status-dot '+m.status;
  document.getElementById('statusText').textContent=m.status==='ok'?'安全':m.status==='warning'?'要注意':'赤字リスク';
  document.getElementById('reasonText').textContent=m.message;
}

function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});document.getElementById(id).classList.add('active')}
function goToDashboard(){if(!project){showScreen('setupScreen');return}showScreen('dashboardScreen');renderDashboard()}
function goToReport(){showScreen('reportScreen');currentWorkers=0;document.getElementById('workerDisplay').textContent='0';document.getElementById('progressSlider').value=0;document.getElementById('progressDisplay').textContent='0%';document.getElementById('memo').value=''}
function goToDetail(){showScreen('detailScreen');renderDetail()}
function adjustWorkers(d){currentWorkers=Math.max(0,currentWorkers+d);document.getElementById('workerDisplay').textContent=currentWorkers}
function updateProgress(){document.getElementById('progressDisplay').textContent=document.getElementById('progressSlider').value+'%'}
function selectWeather(btn,w){document.querySelectorAll('.weather-btn').forEach(function(b){b.classList.remove('selected')});btn.classList.add('selected');currentWeather=w}
function toggleChanges(btn,v){document.querySelectorAll('.toggle-btn').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');currentChanges=v;document.getElementById('changesAmount').classList.toggle('show',v)}

function submitReport(){
  if(!currentWorkers&&document.getElementById('progressSlider').value==0){alert('データを入力してください');return}
  project.reports.push({date:new Date().toISOString(),workers:currentWorkers,progress:parseInt(document.getElementById('progressSlider').value),weather:currentWeather,hasChanges:currentChanges,changesAmount:currentChanges?parseInt(document.getElementById('changesAmount').value||0)*10000:0,memo:document.getElementById('memo').value});
  localStorage.setItem('genbanome_project',JSON.stringify(project));
  alert('日報を送信しました');goToDashboard();
}

function renderDetail(){
  var last7=project.reports.slice(-7);
  var html='<div class="report-table-row"><div>日付</div><div>人数</div><div>進捗</div><div>メモ</div></div>';
  for(var i=0;i<last7.length;i++){var r=last7[i];var d=new Date(r.date).toLocaleDateString('ja-JP').split('/').slice(1).join('/');html+='<div class="report-table-row"><div style="color:#999">'+d+'</div><div>'+r.workers+'人</div><div>'+r.progress+'%</div><div style="font-size:11px;color:#999">'+(r.memo?r.memo.substring(0,15):'-')+'</div></div>'}
  document.getElementById('reportTable').innerHTML=html||'<div style="color:#999;padding:20px;text-align:center">日報がまだありません</div>';
  setTimeout(function(){
    var container=document.querySelector('#detailScreen .chart-container');
    container.innerHTML='<canvas></canvas>';
    var canvas=container.querySelector('canvas');
    if(project.reports.length>0){
      new Chart(canvas,{type:'line',data:{labels:project.reports.map(function(_,i){return i+1}),datasets:[{label:'実績',data:project.reports.map(function(r){return r.progress}),borderColor:'#ff6b35',backgroundColor:'rgba(255,107,53,0.08)',borderWidth:2,pointRadius:0,tension:0.4,fill:true},{label:'計画',data:project.reports.map(function(_,i){return((i+1)/Math.max(project.reports.length,1))*100}),borderColor:'#ddd',borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{font:{size:11}}}},scales:{y:{beginAtZero:true,max:100},x:{}}}});
    }
  },100);
}

function downloadCSV(){
  var csv='\u65e5\u4ed8,\u4eba\u6570,\u9032\u6357\u7387,\u5929\u5019,\u8ffd\u52a0\u5de5\u4e8b,\u30e1\u30e2\n';
  for(var i=0;i<project.reports.length;i++){var r=project.reports[i];csv+=new Date(r.date).toLocaleDateString('ja-JP')+','+r.workers+','+r.progress+'%,'+(r.weather||'')+','+(r.hasChanges?'\u25cb':'-')+','+(r.memo||'')+'\n'}
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='genbanome_'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}

function changeProject(){if(confirm('工事を変更しますか？')){localStorage.removeItem('genbanome_project');project=null;showScreen('setupScreen')}}
function resetData(){if(confirm('全データを削除しますか？')){localStorage.removeItem('genbanome_project');project=null;showScreen('setupScreen')}}

window.addEventListener('load',function(){var saved=localStorage.getItem('genbanome_project');if(saved){project=JSON.parse(saved);goToDashboard()}});
</script>
</body>
</html>
