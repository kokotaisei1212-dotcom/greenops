<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOps - 粗利着地予測ダッシュボード</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f8;color:#1a1a1a}
.header{background:#fff;border-bottom:1px solid #e0e0e0;padding:20px 40px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:700}.logout-btn{background:#f0f0f0;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px}
.container{max-width:1400px;margin:0 auto;padding:40px}
.tab-nav{display:flex;gap:0;margin-bottom:30px;border-bottom:1px solid #e0e0e0}.tab-btn{background:none;border:none;padding:15px 20px;cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s}.tab-btn.active{border-bottom-color:#000}.tab-btn:hover{color:#666}
.tab-content{display:none}.tab-content.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}.kpi-card{background:#fff;padding:25px;border-radius:6px;border:1px solid #e0e0e0}.kpi-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;font-weight:700}.kpi-value{font-size:28px;font-weight:700;margin-bottom:5px}.kpi-change{font-size:12px;color:#666}
.project-list{display:grid;gap:15px}
.project-card{background:#fff;padding:25px;border-radius:6px;border:1px solid #e0e0e0}
.project-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.project-title{font-size:16px;font-weight:700}.project-meta{font-size:12px;color:#999;margin-top:5px}
.project-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-bottom:20px}.stat{text-align:center}.stat-label{font-size:11px;color:#999;text-transform:uppercase;margin-bottom:5px}.stat-value{font-size:18px;font-weight:700}
.alert{padding:15px;border-radius:4px;margin-bottom:15px;font-size:13px}.alert.danger{background:#fce4e4;border-left:3px solid #e74c3c;color:#c0392b}.alert.warning{background:#fef5e7;border-left:3px solid #f39c12;color:#d68910}
.form-section{background:#fff;padding:30px;border-radius:6px;border:1px solid #e0e0e0;margin-bottom:20px}.form-section-title{font-size:15px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:15px}.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.form-input,.form-select{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:13px;font-family:inherit}.form-input:focus,.form-select:focus{outline:none;border-color:#000}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.button-group{display:flex;gap:10px;margin-top:20px}.btn{padding:12px 24px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s}.btn-primary{background:#000;color:#fff}.btn-primary:hover{background:#333}.btn-secondary{background:#f0f0f0;color:#000;border:1px solid #ddd}
.analysis-section{background:#fff;padding:25px;border-radius:6px;border:1px solid #e0e0e0;margin-bottom:20px}.analysis-title{font-size:14px;font-weight:700;margin-bottom:15px}.analysis-item{padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:13px}.analysis-item:last-child{border-bottom:none}.analysis-label{color:#999;margin-bottom:3px}.analysis-value{font-weight:600}
@media(max-width:768px){.kpi-grid,.project-stats{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}.container{padding:20px}.header{padding:20px}}
</style>
</head>
<body>
<div class="header"><div class="logo">GreenOps</div><button class="logout-btn" onclick="if(confirm('\u30ed\u30b0\u30a2\u30a6\u30c8\u3057\u307e\u3059\u304b\uff1f'))location.href='/'">ログアウト</button></div>
<div class="container">
<div class="tab-nav">
<button class="tab-btn active" onclick="switchTab('dashboard',this)">ダッシュボード</button>
<button class="tab-btn" onclick="switchTab('input',this)">日報入力</button>
<button class="tab-btn" onclick="switchTab('analysis',this)">分析詳細</button>
<button class="tab-btn" onclick="switchTab('export',this)">CSVエクスポート</button>
</div>

<div id="dashboard" class="tab-content active">
<div class="kpi-grid">
<div class="kpi-card"><div class="kpi-label">全工事平均粗利率</div><div class="kpi-value">16.8%</div><div class="kpi-change">前月比 +2.1%</div></div>
<div class="kpi-card"><div class="kpi-label">進行中の工事</div><div class="kpi-value">12件</div><div class="kpi-change">赤字リスク 2件</div></div>
<div class="kpi-card"><div class="kpi-label">3週間先完工予定</div><div class="kpi-value">7件</div><div class="kpi-change">赤字予兆 1件</div></div>
<div class="kpi-card"><div class="kpi-label">先月実績粗利額</div><div class="kpi-value">2,485万</div><div class="kpi-change">前月比 +284万</div></div>
</div>
<div class="project-list" id="projectList"></div>
</div>

<div id="input" class="tab-content">
<div class="form-section">
<div class="form-section-title">本日の日報を入力</div>
<div class="form-group"><label class="form-label">工事を選択</label><select class="form-select" id="projectSelect" onchange="updateProjectInfo()"><option value="0">工事A</option><option value="1">工事B</option><option value="2">工事C</option><option value="3">工事D</option></select></div>
<div id="projectInfo" style="background:#f9f9f9;padding:15px;border-radius:4px;margin-bottom:20px;font-size:12px"></div>
<div class="form-row"><div class="form-group"><label class="form-label">本日の人数（人）</label><input type="number" class="form-input" placeholder="8" value="8"></div><div class="form-group"><label class="form-label">進捗率（%）</label><input type="number" class="form-input" placeholder="65" value="65"></div><div class="form-group"><label class="form-label">天候</label><select class="form-select"><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div><div class="form-group"><label class="form-label">追加工事（万円）</label><input type="number" class="form-input" placeholder="0" value="0"></div></div>
<div class="form-group"><label class="form-label">メモ</label><input type="text" class="form-input" placeholder="特記事項"></div>
<div class="button-group"><button class="btn btn-primary" onclick="submitDaily()">日報を保存</button></div>
</div>
</div>

<div id="analysis" class="tab-content"><div id="analysisContent"></div></div>

<div id="export" class="tab-content">
<div class="form-section">
<div class="form-section-title">データをエクスポート</div>
<div class="form-group"><label class="form-label">期間選択</label><div class="form-row"><div><label class="form-label" style="font-size:11px">開始日</label><input type="date" class="form-input"></div><div><label class="form-label" style="font-size:11px">終了日</label><input type="date" class="form-input"></div></div></div>
<div class="form-group"><label class="form-label">出力内容</label><div style="display:flex;gap:20px"><label style="font-size:13px"><input type="checkbox" checked> 工事別集計</label><label style="font-size:13px"><input type="checkbox" checked> 日別詳細</label><label style="font-size:13px"><input type="checkbox" checked> 粗利分析</label></div></div>
<div class="button-group"><button class="btn btn-primary" onclick="exportCSV()">CSVをダウンロード</button></div>
</div>
</div>
</div>

<script>
var projectData=[
{id:0,budget:1200,spent:915,progress:65,days:30,elapsed:12,people:8,daily:[18.2,18.5,18.3,18.1,18.6,18.4,18.2],trend:'\u2197'},
{id:1,budget:780,spent:624,progress:42,days:35,elapsed:10,people:6,daily:[20.5,20.1,20.3,20.2,20.0,19.8,19.5],trend:'\u2198'},
{id:2,budget:380,spent:465,progress:78,days:20,elapsed:14,people:5,daily:[8.5,6.2,4.8,2.1,1.2,-2.1,-4.5],trend:'\u2198\u2198'},
{id:3,budget:520,spent:478,progress:28,days:38,elapsed:8,people:7,daily:[8.1,7.9,8.3,8.0,8.2,8.1,8.3],trend:'\u2192'}
];

function switchTab(tab,btn){
document.querySelectorAll('.tab-content').forEach(function(e){e.classList.remove('active')});
document.querySelectorAll('.tab-btn').forEach(function(e){e.classList.remove('active')});
document.getElementById(tab).classList.add('active');
btn.classList.add('active');
if(tab==='dashboard')renderDashboard();
if(tab==='analysis')renderAnalysis();
}

function renderDashboard(){
var list=document.getElementById('projectList');list.innerHTML='';
projectData.forEach(function(p){
var margin=p.budget-p.spent,rate=(margin/p.budget*100).toFixed(1),remaining=Math.ceil(p.days*(1-p.progress/100));
var alertHtml='';
if(parseFloat(rate)<10)alertHtml='<div class="alert danger">\u8d64\u5b57\u30ea\u30b9\u30af: \u7c97\u5229\u7387\u304c'+rate+'%\u3067\u3059\u3002\u5bfe\u5fdc\u304c\u5fc5\u8981\u3067\u3059\u3002</div>';
else if(parseFloat(rate)<15)alertHtml='<div class="alert warning">\u6ce8\u610f: \u7c97\u5229\u7387\u304c'+rate+'%\u3068\u4f4e\u4e0b\u3057\u3066\u3044\u307e\u3059\u3002</div>';
var card=document.createElement('div');card.className='project-card';
card.innerHTML=alertHtml+'<div class="project-header"><div><div class="project-title">\u5de5\u4e8b '+String.fromCharCode(65+p.id)+'</div><div class="project-meta">\u9032\u6357'+p.progress+'% | \u6b8b\u308a'+remaining+'\u65e5 | \u4eba\u6570'+p.people+'\u4eba</div></div><div style="text-align:right"><div style="font-size:24px;font-weight:700">'+rate+'%</div><div style="font-size:12px;color:#666">\u7c97\u5229\u7387</div></div></div><div class="project-stats"><div class="stat"><div class="stat-label">\u4e88\u7b97</div><div class="stat-value">'+p.budget+'\u4e07</div></div><div class="stat"><div class="stat-label">\u4e88\u60f3\u652f\u51fa</div><div class="stat-value">'+p.spent+'\u4e07</div></div><div class="stat"><div class="stat-label">\u7c97\u5229</div><div class="stat-value" style="color:'+(parseFloat(rate)<10?'#e74c3c':'#2ecc71')+'">'+margin+'\u4e07</div></div><div class="stat"><div class="stat-label">\u30c8\u30ec\u30f3\u30c9</div><div class="stat-value">'+p.trend+'</div></div><div class="stat"><div class="stat-label">\u5b8c\u5de5\u4e88\u5b9a</div><div class="stat-value">'+remaining+'\u65e5\u5f8c</div></div></div>';
list.appendChild(card);
});
}

function updateProjectInfo(){
var idx=parseInt(document.getElementById('projectSelect').value),p=projectData[idx],rate=((p.budget-p.spent)/p.budget*100).toFixed(1);
document.getElementById('projectInfo').innerHTML='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px"><div><strong>\u4e88\u7b97:</strong> '+p.budget+'\u4e07</div><div><strong>\u9032\u6357:</strong> '+p.progress+'%</div><div><strong>\u7c97\u5229\u7387:</strong> '+rate+'%</div><div><strong>\u6b8b\u5de5\u671f:</strong> '+(p.days-Math.ceil(p.days*p.progress/100))+'\u65e5</div></div>';
}

function renderAnalysis(){
var content=document.getElementById('analysisContent');content.innerHTML='';
projectData.forEach(function(p){
var margin=p.budget-p.spent,rate=(margin/p.budget*100).toFixed(1);
var dailyAvg=(p.daily.reduce(function(a,b){return a+b})/p.daily.length).toFixed(1);
var remaining=Math.ceil(p.days*(1-p.progress/100));
var section=document.createElement('div');section.className='analysis-section';
section.innerHTML='<div class="analysis-title">\u5de5\u4e8b '+String.fromCharCode(65+p.id)+' - \u7c97\u5229\u5206\u6790</div><div class="analysis-item"><div class="analysis-label">\u73fe\u5728\u306e\u7c97\u5229\u7387</div><div class="analysis-value">'+rate+'%</div></div><div class="analysis-item"><div class="analysis-label">\u8a08\u7b97\u5f0f</div><div class="analysis-value">('+p.budget+'\u4e07 - '+p.spent+'\u4e07) / '+p.budget+'\u4e07 = '+rate+'%</div></div><div class="analysis-item"><div class="analysis-label">7\u65e5\u5e73\u5747\u7c97\u5229\u7387</div><div class="analysis-value">'+dailyAvg+'%</div></div><div class="analysis-item"><div class="analysis-label">\u4eba\u6570</div><div class="analysis-value">'+p.people+'\u4eba / \u6b8b\u308a'+remaining+'\u65e5</div></div>'+(parseFloat(rate)<15?'<div class="analysis-item" style="background:#fce4e4;padding:10px;border-radius:4px;margin-top:10px"><div class="analysis-label">\u5224\u5b9a: \u8d64\u5b57\u30ea\u30b9\u30af</div><div class="analysis-value">\u5bfe\u5fdc: \u4eba\u6570\u524a\u6e1b / \u539f\u4fa1\u898b\u76f4\u3057</div></div>':'');
content.appendChild(section);
});
}

function submitDaily(){alert('\u65e5\u5831\u3092\u4fdd\u5b58\u3057\u307e\u3057\u305f\u3002\u7c97\u5229\u304c\u66f4\u65b0\u3055\u308c\u307e\u3059\u3002');switchTab('dashboard',document.querySelector('.tab-btn'))}

function exportCSV(){
var csv='\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u65e5,'+new Date().toLocaleDateString('ja-JP')+'\n\n\u5de5\u4e8b,\u4e88\u7b97(\u4e07),\u652f\u51fa(\u4e07),\u7c97\u5229(\u4e07),\u7c97\u5229\u7387,\u9032\u6357,\u4eba\u6570\n';
projectData.forEach(function(p,i){var m=p.budget-p.spent,r=(m/p.budget*100).toFixed(1);csv+='\u5de5\u4e8b'+String.fromCharCode(65+i)+','+p.budget+','+p.spent+','+m+','+r+'%,'+p.progress+'%,'+p.people+'\n'});
var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='greenops_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

renderDashboard();updateProjectInfo();
</script>
</body>
</html>
