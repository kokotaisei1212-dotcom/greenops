<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenOps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Hiragino Sans",sans-serif}
body{background:#f0f4f0;color:#1a3a1a;padding:16px}
.c{max-width:1100px;margin:0 auto}
header{background:linear-gradient(135deg,#0f5132,#1a7a4a);color:#fff;padding:24px;border-radius:14px;margin-bottom:20px}
h1{font-size:26px}.sub{font-size:13px;opacity:.95;margin-top:4px}
nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
nav button{padding:11px 18px;border:2px solid #0f5132;background:#fff;border-radius:10px;cursor:pointer;font-weight:700;color:#0f5132;font-size:14px}
nav button.act{background:#0f5132;color:#fff}
.tab{display:none;background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.tab.act{display:block}
h2{color:#0f5132;margin-bottom:18px;border-bottom:3px solid #0f5132;padding-bottom:10px}
h3{color:#0f5132;margin-bottom:12px;font-size:16px}
.f{margin-bottom:14px}
label{display:block;font-weight:700;margin-bottom:6px;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:2px solid #d0e0d0;border-radius:8px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f5132}
.btn{background:#0f5132;color:#fff;padding:13px 24px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;width:100%}
.btn:hover{background:#0a3a22}
.btn-d{background:#c0392b}.btn-s{background:#fff;color:#0f5132;border:2px solid #0f5132}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.k{background:linear-gradient(135deg,#f0f8f0,#e0f0e0);padding:18px;border-radius:12px;border-left:5px solid #0f5132}
.k-l{font-size:11px;color:#666;font-weight:600;margin-bottom:6px}
.k-v{font-size:24px;font-weight:800;color:#0f5132}
.card{background:#f8fbf8;border:1px solid #d0e0d0;padding:16px;border-radius:10px;margin-bottom:12px}
.card h4{color:#0f5132;margin-bottom:8px}
.alert{padding:14px;border-radius:10px;margin-bottom:10px;font-weight:600;font-size:14px}
.a-c{background:#fee;color:#c0392b;border-left:5px solid #c0392b}
.a-w{background:#fff8e1;color:#8a6d00;border-left:5px solid #f39c12}
.empty{text-align:center;padding:40px;color:#999}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.rdv{text-align:center;font-size:22px;font-weight:800;color:#0f5132;margin-top:6px}
table{width:100%;font-size:13px;border-collapse:collapse}
table td{padding:8px;border-bottom:1px solid #e0e8e0}
table td:last-child{text-align:right;font-weight:700}
.trend{display:flex;align-items:flex-end;gap:6px;height:140px;margin:14px 0;padding:10px 10px 30px;background:#fff;border-radius:8px;border:1px solid #d0e0d0}
.bar{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:8px}
.bar-l{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:#666;white-space:nowrap}
.warn-3w{background:linear-gradient(135deg,#fff3cd,#ffe69c);padding:16px;border-radius:10px;border:2px solid #f39c12;margin:14px 0}
.reason{background:#f0f8f0;padding:12px;border-radius:8px;margin-top:10px;font-size:13px;border-left:3px solid #0f5132;line-height:1.7}
.del{background:#fff;color:#c0392b;border:1px solid #c0392b;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;margin-top:8px}
</style></head><body><div class="c">
<header><h1>🟢 GreenOps</h1><div class="sub">建設業向け原価管理SaaS / 赤字工事を3週間前に止める</div></header>
<nav>
<button class="act" data-t="dash">📊 ダッシュボード</button>
<button data-t="proj">🏗️ 工事管理</button>
<button data-t="rep">📝 日報入力</button>
<button data-t="ana">📈 AI分析</button>
<button data-t="set">⚙️ 設定</button>
</nav>
<div id="dash" class="tab act">
<h2>ダッシュボード</h2>
<div class="kpi">
<div class="k"><div class="k-l">進行中の工事</div><div class="k-v" id="k1">0件</div></div>
<div class="k"><div class="k-l">合計予算</div><div class="k-v" id="k2">¥0万</div></div>
<div class="k"><div class="k-l">予測粗利合計</div><div class="k-v" id="k3">¥0万</div></div>
<div class="k"><div class="k-l">赤字リスク</div><div class="k-v" id="k4">0件</div></div>
</div>
<div id="al"></div><div id="pl"></div>
</div>
<div id="proj" class="tab">
<h2>工事管理(無制限登録可能)</h2>
<div class="f"><label>工事名 *</label><input id="pn" placeholder="例: 〇〇邸新築工事"></div>
<div class="f"><label>クライアント名 *</label><input id="pc" placeholder="例: 山田建設"></div>
<div class="row">
<div class="f"><label>予算(万円)*</label><input type="number" id="pb" placeholder="5000"></div>
<div class="f"><label>工期(日数)*</label><input type="number" id="pd" placeholder="100"></div>
</div>
<div class="f"><label>開始日 *</label><input type="date" id="ps"></div>
<button class="btn" id="addP">＋ 工事を登録</button>
<div id="pjList" style="margin-top:24px"></div>
</div>
<div id="rep" class="tab">
<h2>日報入力</h2>
<div class="f"><label>工事を選択 *</label><select id="rp"><option value="">-- 先に工事を登録 --</option></select></div>
<div class="f"><label>日付 *</label><input type="date" id="rd"></div>
<div class="f"><label>進捗率(%) *</label><input type="range" id="rpr" min="0" max="100" value="0"><div class="rdv" id="rprv">0%</div></div>
<div class="row">
<div class="f"><label>作業人数 *</label><input type="number" id="rw" placeholder="10"></div>
<div class="f"><label>追加費用(万円)</label><input type="number" id="rc" placeholder="0"></div>
</div>
<div class="f"><label>天候</label><select id="rwt"><option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option></select></div>
<div class="f"><label>備考</label><textarea id="rm" rows="3"></textarea></div>
<button class="btn" id="addR">日報を保存</button>
</div>
<div id="ana" class="tab">
<h2>AI粗利分析</h2>
<div id="anaC"><p class="empty">工事を登録して日報を入力するとAI分析が表示されます</p></div>
</div>
<div id="set" class="tab">
<h2>設定</h2>
<div style="margin-bottom:24px">
<h3>📥 CSVレポート出力</h3>
<p style="font-size:13px;color:#666;margin-bottom:10px">全工事の粗利分析をCSVで出力</p>
<button class="btn" id="csvB">CSVをダウンロード</button>
</div>
<div style="margin-bottom:24px">
<h3>🔗 連携サービス問い合わせ</h3>
<p style="font-size:13px;color:#666;margin-bottom:10px">freee / マネーフォワード / ANDPAD 連携</p>
<button class="btn btn-s" id="ctcB">連携について問い合わせる</button>
</div>
<div>
<h3 style="color:#c0392b">⚠️ いつでも解約可能</h3>
<p style="font-size:13px;color:#666;margin-bottom:10px">全データを完全に削除します</p>
<button class="btn btn-d" id="rstB">全データを削除して解約</button>
</div>
</div>
</div>
<script>
let projects=[],reports=[];
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('act'));
    document.getElementById(b.dataset.t).classList.add('act');
    b.classList.add('act');
    if(b.dataset.t==='dash')renderDash();
    if(b.dataset.t==='ana')renderAna();
    if(b.dataset.t==='proj')renderPjList();
  });
});
document.getElementById('rpr').addEventListener('input',function(){document.getElementById('rprv').textContent=this.value+'%';});
function fmt(n){return '¥'+Math.round(n).toLocaleString()+'万'}
function save(){try{localStorage.setItem('go_p',JSON.stringify(projects));localStorage.setItem('go_r',JSON.stringify(reports));}catch(e){}}
function load(){try{projects=JSON.parse(localStorage.getItem('go_p')||'[]');reports=JSON.parse(localStorage.getItem('go_r')||'[]');}catch(e){}}
function updateSel(){
  const s=document.getElementById('rp');
  s.innerHTML='<option value="">-- 工事を選択 --</option>';
  projects.forEach(p=>s.innerHTML+='<option value="'+p.id+'">'+p.name+'</option>');
}
function calcProfit(p){
  const rs=reports.filter(r=>r.pid===p.id).sort((a,b)=>a.date.localeCompare(b.date));
  const baseCost=p.budget*0.8;
  const extraCost=rs.reduce((s,r)=>s+(r.cost||0),0);
  const lastProgress=rs.length?rs[rs.length-1].progress:0;
  const daysElapsed=rs.length;
  const daysRemaining=Math.max(p.days-daysElapsed,0);
  const avgDailyExtra=rs.length?extraCost/rs.length:0;
  const projectedExtra=avgDailyExtra*daysRemaining;
  const totalCost=baseCost+extraCost+projectedExtra;
  const profit=p.budget-totalCost;
  const rate=(profit/p.budget)*100;
  let risk='safe';
  if(profit<0)risk='critical';
  else if(rate<10)risk='warning';
  const confidence=Math.min(rs.length*10+30,95);
  return{profit,rate,risk,cost:totalCost,baseCost,extraCost,projectedExtra,confidence,reportCount:rs.length,daysRemaining,lastProgress,avgDailyExtra};
}
function calc7DayTrend(p){
  const rs=reports.filter(r=>r.pid===p.id).sort((a,b)=>a.date.localeCompare(b.date));
  if(rs.length===0)return[];
  const trend=[];
  for(let i=1;i<=Math.min(rs.length,7);i++){
    const sub=rs.slice(0,i);
    const extra=sub.reduce((s,r)=>s+(r.cost||0),0);
    const avgDaily=extra/i;
    const remaining=Math.max(p.days-i,0);
    const projExtra=avgDaily*remaining;
    const total=p.budget*0.8+extra+projExtra;
    trend.push({date:sub[i-1].date,profit:p.budget-total});
  }
  return trend;
}
function check3WeekRisk(p){
  const rs=reports.filter(r=>r.pid===p.id);
  if(rs.length<2)return null;
  const recent=rs.slice(-Math.min(rs.length,5)).map(r=>r.cost||0);
  const recentAvg=recent.reduce((a,b)=>a+b,0)/recent.length;
  const projected21=recentAvg*21;
  const c=calcProfit(p);
  const futureProfit=c.profit-projected21;
  if(futureProfit<0&&c.profit>=0)return{projectedLoss:futureProfit};
  return null;
}
document.getElementById('addP').addEventListener('click',function(){
  const n=document.getElementById('pn').value.trim();
  const c=document.getElementById('pc').value.trim();
  const b=parseFloat(document.getElementById('pb').value);
  const d=parseInt(document.getElementById('pd').value);
  const s=document.getElementById('ps').value;
  if(!n||!c||!b||!d||!s){alert('全項目を入力してください');return;}
  projects.push({id:Date.now(),name:n,client:c,budget:b,days:d,start:s});
  save();
  ['pn','pc','pb','pd'].forEach(x=>document.getElementById(x).value='');
  updateSel();renderPjList();
  alert('✅ 工事を登録しました: '+n);
});
document.getElementById('addR').addEventListener('click',function(){
  const pid=document.getElementById('rp').value;
  const d=document.getElementById('rd').value;
  const pr=parseInt(document.getElementById('rpr').value);
  const w=parseInt(document.getElementById('rw').value);
  const c=parseFloat(document.getElementById('rc').value)||0;
  if(!pid||!d||!w){alert('工事・日付・人数は必須です');return;}
  reports.push({pid:parseInt(pid),date:d,progress:pr,workers:w,cost:c,weather:document.getElementById('rwt').value,memo:document.getElementById('rm').value});
  save();
  document.getElementById('rc').value='';document.getElementById('rm').value='';
  alert('✅ 日報を保存しました');
});
function renderDash(){
  document.getElementById('k1').textContent=projects.length+'件';
  let totalB=0,totalP=0,riskN=0;
  const alerts=[];
  projects.forEach(p=>{
    const c=calcProfit(p);
    totalB+=p.budget;totalP+=c.profit;
    if(c.risk==='critical'){riskN++;alerts.push('<div class="alert a-c">🚨 <b>'+p.name+'</b>: 赤字確定予測 '+fmt(c.profit)+' (粗利率'+c.rate.toFixed(1)+'%)</div>');}
    else if(c.risk==='warning'){alerts.push('<div class="alert a-w">⚠️ <b>'+p.name+'</b>: 利益率低下 '+c.rate.toFixed(1)+'%</div>');}
    const w3=check3WeekRisk(p);
    if(w3)alerts.push('<div class="alert a-w">⏰ <b>'+p.name+'</b>: 3週間先に赤字転落予測 (予測損失'+fmt(w3.projectedLoss)+')</div>');
  });
  document.getElementById('k2').textContent=fmt(totalB);
  document.getElementById('k3').textContent=fmt(totalP);
  document.getElementById('k4').textContent=riskN+'件';
  document.getElementById('al').innerHTML=alerts.join('');
  if(projects.length===0){document.getElementById('pl').innerHTML='<p class="empty">工事がまだ登録されていません<br>「工事管理」タブから登録してください</p>';return;}
  document.getElementById('pl').innerHTML='<h3 style="margin-top:20px">進行中の工事</h3>'+projects.map(p=>{
    const c=calcProfit(p);
    return '<div class="card"><h4>'+p.name+'</h4><p style="font-size:12px;color:#666">'+p.client+' / 予算'+fmt(p.budget)+' / 工期'+p.days+'日</p><p style="margin-top:8px">進捗: <b>'+c.lastProgress+'%</b> | 予測粗利: <b style="color:'+(c.profit<0?'#c0392b':'#0f5132')+'">'+fmt(c.profit)+'</b> ('+c.rate.toFixed(1)+'%)</p><p style="font-size:11px;color:#888;margin-top:4px">日報'+c.reportCount+'件 / AI信頼度'+c.confidence+'%</p></div>';
  }).join('');
}
function renderPjList(){
  const el=document.getElementById('pjList');
  if(projects.length===0){el.innerHTML='';return;}
  el.innerHTML='<h3>登録済み工事</h3>'+projects.map(p=>'<div class="card"><h4>'+p.name+'</h4><p style="font-size:12px;color:#666">'+p.client+' / '+fmt(p.budget)+' / '+p.days+'日</p><button class="del" onclick="delProj('+p.id+')">この工事を削除</button></div>').join('');
}
window.delProj=function(id){
  if(!confirm('この工事と関連日報を削除しますか?'))return;
  projects=projects.filter(p=>p.id!==id);
  reports=reports.filter(r=>r.pid!==id);
  save();updateSel();renderPjList();renderDash();
};
function renderAna(){
  if(projects.length===0){document.getElementById('anaC').innerHTML='<p class="empty">工事を登録してください</p>';return;}
  document.getElementById('anaC').innerHTML=projects.map(p=>{
    const c=calcProfit(p);
    const trend=calc7DayTrend(p);
    const w3=check3WeekRisk(p);
    let trendHtml='';
    if(trend.length>0){
      const max=Math.max(...trend.map(t=>Math.abs(t.profit)),1);
      trendHtml='<h4 style="margin-top:14px">📈 7日間粗利トレンド</h4><div class="trend">'+trend.map(t=>{
        const h=Math.max(Math.abs(t.profit/max)*100,5);
        const color=t.profit<0?'#c0392b':'#0f5132';
        return '<div class="bar" style="height:'+h+'%;background:'+color+'" title="'+t.date+': '+fmt(t.profit)+'"><div class="bar-l">'+t.date.slice(5)+'</div></div>';
      }).join('')+'</div>';
    }
    let warn3w='';
    if(w3)warn3w='<div class="warn-3w">⏰ <b>3週間先リスク警告</b><br>このまま追加費用が発生し続けると、約21日後に赤字転落予測。<br>予測損失: <b>'+fmt(w3.projectedLoss)+'</b></div>';
    return '<div class="card"><h4>'+p.name+'</h4><table>'+
      '<tr><td>予算</td><td>'+fmt(p.budget)+'</td></tr>'+
      '<tr><td>標準原価(予算×80%)</td><td>'+fmt(c.baseCost)+'</td></tr>'+
      '<tr><td>追加発生費用(実績)</td><td>'+fmt(c.extraCost)+'</td></tr>'+
      '<tr><td>追加費用予測(残工期分)</td><td>'+fmt(c.projectedExtra)+'</td></tr>'+
      '<tr><td>予測総原価</td><td>'+fmt(c.cost)+'</td></tr>'+
      '<tr><td><b>予測粗利</b></td><td style="color:'+(c.profit<0?'#c0392b':'#0f5132')+'">'+fmt(c.profit)+'</td></tr>'+
      '<tr><td>粗利率</td><td>'+c.rate.toFixed(1)+'%</td></tr>'+
      '<tr><td>AI信頼度</td><td>'+c.confidence+'%</td></tr>'+
      '<tr><td>リスク判定</td><td>'+(c.risk==='critical'?'🚨 赤字':c.risk==='warning'?'⚠️ 注意':'✅ 安全')+'</td></tr>'+
      '</table>'+warn3w+trendHtml+
      '<div class="reason"><b>🤖 AI分析の根拠:</b><br>'+
      '・日報入力数: '+c.reportCount+'件(多いほど精度向上)<br>'+
      '・1日あたり平均追加費用: '+fmt(c.avgDailyExtra)+'<br>'+
      '・残り工期: '+c.daysRemaining+'日<br>'+
      '・残工期での追加費用予測 = 平均追加費用 × 残日数 = '+fmt(c.projectedExtra)+'<br>'+
      '・標準原価率は建設業平均の80%を採用<br>'+
      '・判定基準: 粗利<0=赤字 / 粗利率<10%=注意 / それ以上=安全'+
      '</div></div>';
  }).join('');
}
document.getElementById('csvB').addEventListener('click',function(){
  if(projects.length===0){alert('データがありません');return;}
  let csv='工事名,クライアント,予算(万円),工期(日),予測総原価(万円),予測粗利(万円),粗利率(%),リスク,日報数,AI信頼度(%)\n';
  projects.forEach(p=>{
    const c=calcProfit(p);
    csv+='"'+p.name+'","'+p.client+'",'+p.budget+','+p.days+','+Math.round(c.cost)+','+Math.round(c.profit)+','+c.rate.toFixed(1)+','+c.risk+','+c.reportCount+','+c.confidence+'\n';
  });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='greenops_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  alert('✅ CSVをダウンロードしました');
});
document.getElementById('ctcB').addEventListener('click',function(){
  const subject=encodeURIComponent('GreenOps 連携サービスについて');
  const body=encodeURIComponent('GreenOpsの連携サービスについて問い合わせます。\n\n【希望する連携】\n□ freee連携\n□ マネーフォワード連携\n□ ANDPAD連携\n\n【お客様情報】\n会社名: \nお名前: \nご質問: \n');
  window.location.href='mailto:support@greenops.jp?subject='+subject+'&body='+body;
});
document.getElementById('rstB').addEventListener('click',function(){
  if(!confirm('本当に全データを削除して解約しますか?\nこの操作は取り消せません。'))return;
  projects=[];reports=[];
  try{localStorage.removeItem('go_p');localStorage.removeItem('go_r');}catch(e){}
  updateSel();renderDash();renderPjList();
  alert('✅ 全データを削除しました');
});
load();
document.getElementById('rd').value=new Date().toISOString().split('T')[0];
document.getElementById('ps').value=new Date().toISOString().split('T')[0];
updateSel();renderDash();renderPjList();
</script>
</body></html>
