<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOps - 建設業向け原価管理SaaS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#1a1a1a;--secondary:#404040;--tertiary:#606060;--light:#e8e8e8;--lighter:#f5f5f5;--white:#fff;--text:#222;--border:#d0d0d0;--danger:#d32f2f;--warning:#f57c00;--success:#388e3c}
html,body{width:100%;height:100%;font-family:'Segoe UI',sans-serif;background:var(--lighter);color:var(--text);overflow-x:hidden}
.main-wrapper{display:flex;height:100vh;width:100%}
.sidebar{width:260px;background:var(--primary);color:var(--white);padding:30px 20px;overflow-y:auto;position:fixed;height:100vh;left:0;top:0;z-index:100;border-right:1px solid var(--secondary)}.sidebar-logo{font-size:24px;font-weight:700;margin-bottom:30px;display:flex;align-items:center;gap:12px}.sidebar-nav{list-style:none}.sidebar-nav li{margin-bottom:12px}.sidebar-nav button{width:100%;padding:12px 14px;background:var(--secondary);color:var(--white);border:1px solid var(--tertiary);border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;text-align:left}.sidebar-nav button:hover{background:var(--tertiary)}.sidebar-nav button.active{background:var(--white);color:var(--primary)}
.main-content{flex:1;margin-left:260px;overflow-y:auto;padding:35px;background:var(--lighter)}.header{margin-bottom:35px}.header h1{font-size:28px;color:var(--primary);font-weight:700}
.btn{padding:11px 22px;border:1px solid var(--secondary);border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;background:var(--white);color:var(--primary);transition:all 0.2s}.btn:hover{background:var(--light)}.btn-primary{background:var(--primary);color:var(--white)}.btn-primary:hover{background:var(--secondary)}.btn-danger{background:var(--danger);color:var(--white);border-color:var(--danger)}.btn-danger:hover{background:#b71c1c}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--white);border-radius:8px;padding:24px;margin-bottom:20px;border:1px solid var(--border)}.card-title{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--primary)}
.form-group{margin-bottom:18px}label{display:block;margin-bottom:6px;font-weight:600;color:var(--primary);font-size:13px}input,textarea,select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:var(--white);color:var(--text)}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,26,26,0.05)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px}.grid-item{background:var(--white);border-radius:8px;padding:18px;border:1px solid var(--border)}.grid-item:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.kpi-card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}.kpi-value{font-size:24px;font-weight:700;margin:8px 0;color:var(--primary)}.kpi-label{font-size:12px;color:var(--tertiary)}
.alert{padding:14px 18px;margin-bottom:18px;border-radius:6px;border-left:4px solid;background:#fff3e0;border-color:var(--warning);color:#e65100}
.status{padding:14px 18px;margin-bottom:18px;border-radius:6px;border-left:4px solid}.status.success{background:#e8f5e9;border-color:var(--success);color:#1b5e20}.status.error{background:#ffebee;border-color:var(--danger);color:#b71c1c}
.metric-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--light);font-size:13px}.metric-row:last-child{border-bottom:none}.metric-label{color:var(--tertiary);font-weight:600}.metric-value{font-weight:700;color:var(--primary)}.metric-value.danger{color:var(--danger)}.metric-value.success{color:var(--success)}.metric-value.warning{color:var(--warning)}
.empty-state{text-align:center;padding:40px 20px;color:var(--tertiary)}
.ai-explanation{background:var(--lighter);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:12px;font-size:12px;line-height:1.6}
@media(max-width:1024px){.sidebar{width:200px}.main-content{margin-left:200px}.form-row{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.main-wrapper{flex-direction:column}.sidebar{width:100%;height:auto;position:static}.main-content{margin-left:0;padding:20px}.kpi-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="main-wrapper">
<div class="sidebar">
<div class="sidebar-logo"><span>&#x1F7E2;</span><div>GreenOps</div></div>
<ul class="sidebar-nav">
<li><button class="nav-btn active" data-tab="dashboard">ダッシュボード</button></li>
<li><button class="nav-btn" data-tab="projects">工事管理</button></li>
<li><button class="nav-btn" data-tab="reports">日報入力</button></li>
<li><button class="nav-btn" data-tab="analytics">分析</button></li>
<li><button class="nav-btn" data-tab="settings">設定</button></li>
</ul>
</div>
<div class="main-content">
<div id="dashboard" class="tab-content active"><div class="header"><h1>ダッシュボード</h1></div><div id="riskAlert" class="alert" style="display:none"></div><div class="kpi-grid" id="kpiGrid"></div><div class="card"><div class="card-title">進行中の工事</div><div id="projectsGrid" class="grid"></div><div id="emptyProjects" class="empty-state" style="display:none">工事がまだ登録されていません</div></div></div>
<div id="projects" class="tab-content"><div class="header"><h1>工事管理</h1></div><div class="card"><div class="card-title">新規工事登録</div><form id="projectForm"><div class="form-row"><div class="form-group"><label>工事名 *</label><input type="text" id="projectName" required></div><div class="form-group"><label>クライアント名 *</label><input type="text" id="clientName" required></div></div><div class="form-row"><div class="form-group"><label>予算（万円）*</label><input type="number" id="budget" min="1" required></div><div class="form-group"><label>工期（日数）*</label><input type="number" id="duration" min="1" required></div></div><div class="form-row"><div class="form-group"><label>開始日 *</label><input type="date" id="startDate" required></div><div class="form-group"><label>連絡先メール</label><input type="email" id="contactEmail"></div></div><button type="submit" class="btn btn-primary">工事を登録</button></form><div id="projectStatus"></div></div><div id="projectsList"></div></div>
<div id="reports" class="tab-content"><div class="header"><h1>日報入力</h1></div><div class="card"><div class="card-title">本日の日報登録</div><form id="reportForm"><div class="form-row"><div class="form-group"><label>工事を選択 *</label><select id="projectSelect" required><option value="">-- 工事を選択 --</option></select></div><div class="form-group"><label>日付 *</label><input type="date" id="reportDate" required></div></div><div class="form-row"><div class="form-group"><label>進捗率（%）*</label><input type="range" id="progressRange" min="0" max="100" value="0"><div style="text-align:center;font-weight:700;margin-top:8px"><span id="progressValue">0</span>%</div></div><div class="form-group"><label>作業人数 *</label><input type="number" id="workerCount" min="0" required></div></div><div class="form-row"><div class="form-group"><label>天候</label><select id="weather"><option value="sunny">晴れ</option><option value="cloudy">曇り</option><option value="rainy">雨</option><option value="snow">雪</option></select></div><div class="form-group"><label>追加費用（万円）</label><input type="number" id="additionalCost" min="0" value="0"></div></div><div class="form-group"><label>備考</label><textarea id="notes" style="min-height:70px"></textarea></div><button type="submit" class="btn btn-primary">日報を保存</button></form><div id="reportStatus"></div></div></div>
<div id="analytics" class="tab-content"><div class="header"><h1>粗利分析</h1></div><div class="card"><div class="card-title">7日間のトレンド</div><div style="height:300px;position:relative"><canvas id="trendChart"></canvas></div></div><div class="card"><div class="card-title">着地予測と粗利分析</div><div id="analyticsContent"></div></div></div>
<div id="settings" class="tab-content"><div class="header"><h1>設定</h1></div><div class="card"><div class="card-title">CSVレポート出力</div><button class="btn btn-primary" onclick="exportCSV()">ダウンロード</button><div id="exportStatus"></div></div><div class="card"><div class="card-title">解約</div><p style="margin-bottom:16px">全データが削除されます。</p><button class="btn btn-danger" onclick="cancelAccount()">アカウント削除</button></div></div>
</div>
</div>
<script>
var projects=JSON.parse(localStorage.getItem('greenops_projects')||'[]');
var reports=JSON.parse(localStorage.getItem('greenops_reports')||'[]');
var trendChart=null;
function saveData(){localStorage.setItem('greenops_projects',JSON.stringify(projects));localStorage.setItem('greenops_reports',JSON.stringify(reports))}
document.addEventListener('DOMContentLoaded',function(){setupEventListeners();setTodayDate();loadDashboard()});
function setupEventListeners(){document.querySelectorAll('.nav-btn').forEach(function(btn){btn.addEventListener('click',function(e){document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});e.target.classList.add('active');switchTab(e.target.dataset.tab)})});document.getElementById('projectForm').addEventListener('submit',registerProject);document.getElementById('reportForm').addEventListener('submit',registerReport);document.getElementById('progressRange').addEventListener('input',function(e){document.getElementById('progressValue').textContent=e.target.value})}
function switchTab(t){document.querySelectorAll('.tab-content').forEach(function(tab){tab.classList.remove('active')});document.getElementById(t).classList.add('active');if(t==='dashboard')loadDashboard();if(t==='projects')loadProjects();if(t==='analytics')loadAnalytics()}
function setTodayDate(){var t=new Date().toISOString().split('T')[0];document.getElementById('reportDate').value=t;document.getElementById('startDate').value=t}
function calculateMargin(p,r){var wf={sunny:1.0,cloudy:0.95,rainy:0.85,snow:0.75};var w=wf[r.weather]||1.0;var b=p.budget*(r.progress/100);var t=b*w+(r.additionalCost||0);var g=p.budget-t;var rate=(g/p.budget)*100;return{totalCost:t.toFixed(2),grossProfit:g.toFixed(2),grossMarginRate:rate.toFixed(1),formula:p.budget+'\u4e07\u00d7'+r.progress+'%\u00d7'+w+'+'+(r.additionalCost||0)+'\u4e07='+t.toFixed(2)+'\u4e07',marginFormula:'('+p.budget+'\u4e07-'+t.toFixed(2)+'\u4e07)/'+p.budget+'\u4e07='+rate.toFixed(1)+'%'}}
function predictLandingDate(pid){var p=projects.find(function(x){return x.id===pid});if(!p)return null;var pr=reports.filter(function(r){return r.projectId===pid}).sort(function(a,b){return new Date(a.reportDate)-new Date(b.reportDate)});if(pr.length<2)return null;var l=pr[pr.length-1];var de=Math.floor((new Date(l.reportDate)-new Date(p.startDate))/(864e5));if(de===0||l.progress===0)return null;var ppd=l.progress/de;var rd=Math.ceil((100-l.progress)/ppd);var cd=new Date(p.startDate);cd.setDate(cd.getDate()+de+rd);return{completionDate:cd.toISOString().split('T')[0],daysRemaining:rd,isOnTime:de+rd<=p.duration}}
function predict3WeekRisk(){var risks=[];projects.forEach(function(p){var pr=reports.filter(function(r){return r.projectId===p.id});if(!pr.length)return;var l=pr[pr.length-1];var pm=calculateMargin(p,{progress:Math.min(100,l.progress+21*1.5),weather:l.weather,additionalCost:l.additionalCost||0});if(parseFloat(pm.grossMarginRate)<0)risks.push({projectName:p.projectName,currentRate:l.grossMarginRate,predictedRate:pm.grossMarginRate})});return risks}
function getKPI(){var tp=projects.length,ap=0,tb=0,am=0,dp=0;projects.forEach(function(p){tb+=p.budget;var pr=reports.filter(function(r){return r.projectId===p.id});if(pr.length){ap++;var l=pr[pr.length-1];var m=calculateMargin(p,l);am+=parseFloat(m.grossMarginRate);if(parseFloat(m.grossMarginRate)<0)dp++}});return{totalProjects:tp,activeProjects:ap,totalBudget:tb,averageMargin:ap>0?(am/ap).toFixed(1):0,deficitProjects:dp}}
function get7DayTrend(){var t=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var ds=d.toISOString().split('T')[0];var dr=reports.filter(function(r){return r.reportDate===ds});var avg=0;if(dr.length)avg=dr.map(function(r){return parseFloat(r.grossMarginRate||0)}).reduce(function(a,b){return a+b})/dr.length;t.push({date:ds,dayOfMonth:ds.split('-')[2],averageMargin:avg.toFixed(1)})}return t}
function registerProject(e){e.preventDefault();projects.push({id:Date.now().toString(),projectName:document.getElementById('projectName').value,clientName:document.getElementById('clientName').value,budget:Number(document.getElementById('budget').value),duration:Number(document.getElementById('duration').value),startDate:document.getElementById('startDate').value,contactEmail:document.getElementById('contactEmail').value,createdAt:new Date().toISOString()});saveData();showStatus('projectStatus','\u5de5\u4e8b\u3092\u767b\u9332\u3057\u307e\u3057\u305f','success');document.getElementById('projectForm').reset();setTodayDate();setTimeout(function(){document.getElementById('projectStatus').innerHTML='';loadProjects()},1500)}
function registerReport(e){e.preventDefault();var pid=document.getElementById('projectSelect').value;if(!pid){showStatus('reportStatus','\u5de5\u4e8b\u3092\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044','error');return}var p=projects.find(function(x){return x.id===pid});var prog=Number(document.getElementById('progressRange').value);var rd={projectId:pid,reportDate:document.getElementById('reportDate').value,progress:prog,workerCount:Number(document.getElementById('workerCount').value),weather:document.getElementById('weather').value,additionalCost:Number(document.getElementById('additionalCost').value),notes:document.getElementById('notes').value};var m=calculateMargin(p,rd);reports.push({id:Date.now().toString(),...rd,calculatedCost:m.totalCost,grossMargin:m.grossProfit,grossMarginRate:m.grossMarginRate,formula:m.formula,marginFormula:m.marginFormula,createdAt:new Date().toISOString()});saveData();showStatus('reportStatus','\u65e5\u5831\u3092\u4fdd\u5b58: \u7c97\u5229\u7387'+m.grossMarginRate+'%','success');document.getElementById('reportForm').reset();setTodayDate();setTimeout(function(){document.getElementById('reportStatus').innerHTML='';loadDashboard()},1500)}
function loadDashboard(){var kpi=getKPI();var risks=predict3WeekRisk();document.getElementById('kpiGrid').innerHTML='<div class="kpi-card"><div class="kpi-value">'+kpi.totalProjects+'</div><div class="kpi-label">\u7ba1\u7406\u5de5\u4e8b\u6570</div></div><div class="kpi-card"><div class="kpi-value">'+kpi.activeProjects+'</div><div class="kpi-label">\u9032\u884c\u4e2d</div></div><div class="kpi-card"><div class="kpi-value">'+kpi.totalBudget+'\u4e07</div><div class="kpi-label">\u7dcf\u4e88\u7b97</div></div><div class="kpi-card"><div class="kpi-value" style="color:'+(kpi.averageMargin<0?'var(--danger)':'var(--success)')+'">'+kpi.averageMargin+'%</div><div class="kpi-label">\u5e73\u5747\u7c97\u5229\u7387</div></div><div class="kpi-card"><div class="kpi-value" style="color:var(--danger)">'+kpi.deficitProjects+'</div><div class="kpi-label">\u8d64\u5b57\u30ea\u30b9\u30af</div></div>';
if(risks.length>0){document.getElementById('riskAlert').innerHTML='<strong>\u26a0\ufe0f 3\u9031\u9593\u5148\u30ea\u30b9\u30af\u8b66\u544a</strong><br>'+risks.map(function(r){return r.projectName+': '+r.currentRate+'% \u2192 '+r.predictedRate+'%'}).join('<br>');document.getElementById('riskAlert').style.display='block'}else{document.getElementById('riskAlert').style.display='none'}
if(projects.length===0){document.getElementById('projectsGrid').innerHTML='';document.getElementById('emptyProjects').style.display='block';return}document.getElementById('emptyProjects').style.display='none';
var html='';projects.forEach(function(p){var pr=reports.filter(function(r){return r.projectId===p.id});var l=pr[pr.length-1];var prog=0,mr='N/A',rc='';if(l){prog=l.progress;var m=calculateMargin(p,l);mr=m.grossMarginRate;rc=parseFloat(mr)<0?'danger':parseFloat(mr)<5?'warning':'success'}var pred=predictLandingDate(p.id);html+='<div class="grid-item"><div style="font-weight:700;color:var(--primary);margin-bottom:8px">'+p.projectName+'</div><div style="font-size:12px;color:var(--tertiary);margin-bottom:12px">'+p.clientName+'</div><div class="metric-row"><span class="metric-label">\u4e88\u7b97</span><span>'+p.budget+'\u4e07</span></div><div class="metric-row"><span class="metric-label">\u7c97\u5229\u7387</span><span class="metric-value '+rc+'">'+(mr==='N/A'?mr:mr+'%')+'</span></div>'+(pred?'<div class="metric-row"><span class="metric-label">\u7740\u5730\u4e88\u6e2c</span><span>'+pred.completionDate+'</span></div>':'')+'</div>'});document.getElementById('projectsGrid').innerHTML=html}
function loadProjects(){var html='',opts='<option value="">-- \u5de5\u4e8b\u3092\u9078\u629e --</option>';projects.forEach(function(p){opts+='<option value="'+p.id+'">'+p.projectName+'</option>';var pr=reports.filter(function(r){return r.projectId===p.id});var l=pr[pr.length-1];var mi='';if(l){var m=calculateMargin(p,l);mi='<div class="metric-row"><span class="metric-label">\u7c97\u5229\u7387</span><span class="metric-value" style="color:'+(parseFloat(m.grossMarginRate)<0?'var(--danger)':'var(--success)')+'">'+m.grossMarginRate+'%</span></div>'}html+='<div class="card"><div class="card-title">'+p.projectName+'</div><div class="metric-row"><span class="metric-label">\u30af\u30e9\u30a4\u30a2\u30f3\u30c8</span><span>'+p.clientName+'</span></div><div class="metric-row"><span class="metric-label">\u4e88\u7b97</span><span>'+p.budget+'\u4e07</span></div><div class="metric-row"><span class="metric-label">\u5de5\u671f</span><span>'+p.duration+'\u65e5</span></div>'+mi+'</div>'});document.getElementById('projectsList').innerHTML=html;document.getElementById('projectSelect').innerHTML=opts}
function loadAnalytics(){var trend=get7DayTrend();var ctx=document.getElementById('trendChart').getContext('2d');if(trendChart)trendChart.destroy();trendChart=new Chart(ctx,{type:'line',data:{labels:trend.map(function(d){return d.dayOfMonth+'\u65e5'}),datasets:[{label:'\u7c97\u5229\u7387(%)',data:trend.map(function(d){return d.averageMargin}),borderColor:'#1a1a1a',backgroundColor:'rgba(26,26,26,0.05)',tension:0.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
var html='';projects.forEach(function(p){var pr=reports.filter(function(r){return r.projectId===p.id});var l=pr[pr.length-1];if(!l)return;var m=calculateMargin(p,l);var rc=parseFloat(m.grossMarginRate)<0?'danger':'success';var pred=predictLandingDate(p.id);html+='<div class="card"><div class="card-title">'+p.projectName+'</div><div class="metric-row"><span class="metric-label">\u4e88\u7b97</span><span>'+p.budget+'\u4e07</span></div><div class="metric-row"><span class="metric-label">\u898b\u8fbc\u539f\u4fa1</span><span>'+m.totalCost+'\u4e07</span></div><div class="metric-row"><span class="metric-label">\u898b\u8fbc\u7c97\u5229</span><span>'+m.grossProfit+'\u4e07</span></div><div class="metric-row"><span class="metric-label">\u7c97\u5229\u7387</span><span class="metric-value '+rc+'" style="font-size:16px">'+m.grossMarginRate+'%</span></div><div class="ai-explanation"><strong>\u8a08\u7b97\u5f0f:</strong><br>'+m.marginFormula+'</div>'+(pred?'<div class="metric-row" style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px"><span class="metric-label">\u7740\u5730\u4e88\u6e2c</span><span>'+pred.completionDate+'</span></div>':'')+'</div>'});document.getElementById('analyticsContent').innerHTML=html||'<div class="empty-state">\u5206\u6790\u30c7\u30fc\u30bf\u304c\u3042\u308a\u307e\u305b\u3093</div>'}
function exportCSV(){var d=[];projects.forEach(function(p){reports.filter(function(r){return r.projectId===p.id}).forEach(function(r){d.push([p.projectName,p.clientName,p.budget,r.reportDate,r.progress,r.workerCount,r.weather,r.additionalCost,r.calculatedCost,r.grossMarginRate])})});if(!d.length){showStatus('exportStatus','\u30c7\u30fc\u30bf\u304c\u3042\u308a\u307e\u305b\u3093','error');return}var csv='\u5de5\u4e8b\u540d,\u30af\u30e9\u30a4\u30a2\u30f3\u30c8,\u4e88\u7b97,\u65e5\u4ed8,\u9032\u6357,\u4eba\u6570,\u5929\u5019,\u8ffd\u52a0\u8cbb\u7528,\u898b\u8fbc\u539f\u4fa1,\u7c97\u5229\u7387\n'+d.map(function(r){return r.map(function(v){return'"'+v+'"'}).join(',')}).join('\n');var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='greenops-'+new Date().toISOString().split('T')[0]+'.csv';a.click();showStatus('exportStatus','CSV\u3092\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u3057\u307e\u3057\u305f','success')}
function cancelAccount(){if(!confirm('\u672c\u5f53\u306b\u524a\u9664\u3057\u307e\u3059\u304b\uff1f'))return;projects.length=0;reports.length=0;saveData();alert('\u30a2\u30ab\u30a6\u30f3\u30c8\u304c\u524a\u9664\u3055\u308c\u307e\u3057\u305f');location.reload()}
function showStatus(id,msg,type){document.getElementById(id).innerHTML='<div class="status '+type+'">'+msg+'</div>';setTimeout(function(){document.getElementById(id).innerHTML=''},4000)}
</script>
</body>
</html>
