<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOps | ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1f7a3e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:#f9fafb;color:#1a1a1a}
header{background:#fff;padding:20px 0;border-bottom:1px solid #e5e5e5;margin-bottom:40px}
.header-inner{max-width:1200px;margin:0 auto;padding:0 60px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:900;color:var(--g)}
.container{max-width:1200px;margin:0 auto;padding:0 60px}
h1{font-size:32px;font-weight:900;margin-bottom:40px}
.card{background:#fff;border:1px solid #e5e5e5;padding:32px;border-radius:4px;margin-bottom:32px}
.card h2{font-size:20px;font-weight:700;margin-bottom:20px}
.form-group{margin-bottom:16px}
label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid #e5e5e5;border-radius:3px;font-size:13px;font-family:'Noto Sans JP',sans-serif}
.btn{background:var(--g);color:#fff;border:none;padding:12px 24px;border-radius:3px;font-size:13px;font-weight:700;cursor:pointer;margin-right:8px}
.btn:hover{background:#0f6a2f}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin-top:16px}
th{background:#f9fafb;padding:12px;text-align:left;font-weight:700;font-size:12px;border-bottom:1px solid #e5e5e5}
td{padding:12px;border-bottom:1px solid #e5e5e5;font-size:13px}
.result{background:#f1f8f4;border:2px solid var(--g);padding:24px;border-radius:4px;margin-top:16px;text-align:center}
.result-num{font-size:36px;font-weight:900;color:var(--g);margin:12px 0}
footer{text-align:center;color:#999;font-size:12px;padding:40px;background:#fff;border-top:1px solid #e5e5e5;margin-top:40px}
</style>
</head>
<body>
<header>
<div class="header-inner">
<div class="logo">GreenOps</div>
</div>
</header>

<div class="container">
<h1>Scope 3 ダッシュボード</h1>

<div class="card">
<h2>CO2 計算</h2>
<div class="form-group">
<label>建機を選択</label>
<select id="machine">
<option value="">-- 選択 --</option>
<option value="23">油圧ショベル PC200（23kg/h）</option>
<option value="15.5">バックホウ PC78（15.5kg/h）</option>
<option value="12">生コン圧送車（12kg/h）</option>
<option value="18.5">クレーン 50t（18.5kg/h）</option>
<option value="22">ダンプトラック（22kg/h）</option>
</select>
</div>

<div class="form-group">
<label>使用時間（h）</label>
<input type="number" id="hours" value="8">
</div>

<div class="form-group">
<label>記録日</label>
<input type="date" id="date">
</div>

<button class="btn" onclick="calculate()">計算する</button>

<div id="result"></div>

<h3 style="margin-top:32px;margin-bottom:16px;font-size:16px">計算履歴</h3>
<table>
<thead>
<tr>
<th>日付</th>
<th>建機</th>
<th>時間</th>
<th>CO2</th>
</tr>
</thead>
<tbody id="history">
<tr><td colspan="4" style="text-align:center;color:#999">履歴なし</td></tr>
</tbody>
</table>
</div>

<div class="card">
<h2>月次レポート生成</h2>
<p style="margin-bottom:16px;color:#666">大成・清水・大林のゼネコン別フォーマットで PDF を生成します。</p>
<div class="btn-group">
<button class="btn" onclick="alert('大成建設向けレポートを生成しました')">大成建設向け PDF</button>
<button class="btn" onclick="alert('清水建設向けレポートを生成しました')">清水建設向け PDF</button>
<button class="btn" onclick="alert('大林組向けレポートを生成しました')">大林組向け PDF</button>
</div>
</div>

<div class="card">
<h2>設定</h2>
<div class="form-group">
<label>メールアドレス</label>
<input type="email" placeholder="user@example.com">
</div>
<div class="form-group">
<label>会社名</label>
<input type="text" placeholder="会社名">
</div>
<button class="btn" onclick="alert('設定を保存しました')">保存</button>
</div>
</div>

<footer>
<p>&copy; 2026 GreenOps Inc.</p>
</footer>

<script>
var data = [];
document.getElementById('date').valueAsDate = new Date();

function calculate() {
  var coeff = parseFloat(document.getElementById('machine').value);
  var hours = parseFloat(document.getElementById('hours').value);
  var date = document.getElementById('date').value;
  
  if (!coeff || !hours) {
    alert('建機と時間を選択してください');
    return;
  }
  
  var co2 = (coeff * hours / 1000).toFixed(3);
  data.push({date: date, coeff: coeff, hours: hours, co2: co2});
  
  document.getElementById('result').innerHTML = '<div class="result"><div>計算完了</div><div class="result-num">' + co2 + '</div><div>tCO2e / ' + hours + '時間</div></div>';
  
  updateHistory();
}

function updateHistory() {
  var rows = '';
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    rows += '<tr><td>' + d.date + '</td><td>' + d.coeff + 'kg/h</td><td>' + d.hours + 'h</td><td>' + d.co2 + 't</td></tr>';
  }
  document.getElementById('history').innerHTML = rows || '<tr><td colspan="4" style="text-align:center;color:#999">履歴なし</td></tr>';
}
</script>
</body>
</html>
