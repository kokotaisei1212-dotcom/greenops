<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenOps - 建設業の赤字工事を救済するAI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .container{max-width:600px;width:100%;padding:40px 20px}
    .card{background:white;border-radius:12px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
    h1{font-size:32px;color:#333;margin-bottom:15px}
    p{font-size:16px;color:#666;margin-bottom:30px;line-height:1.6}
    .features{text-align:left;margin:30px 0}
    .feature{margin:15px 0;color:#555;font-size:14px;padding-left:24px;position:relative}
    .feature::before{content:"\2713";color:#667eea;font-weight:bold;position:absolute;left:0}
    .btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px;display:block;text-decoration:none;text-align:center}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,0.3)}
    .price{font-size:24px;color:#667eea;font-weight:700;margin:20px 0}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>GreenOps</h1>
      <p>建設業の赤字工事を救済するAI</p>
      <div class="features">
        <div class="feature">赤字化確率をAIが自動判定</div>
        <div class="feature">推定赤字額を可視化</div>
        <div class="feature">工期遅延を予測</div>
        <div class="feature">安全リスクをスコア化</div>
        <div class="feature">対応案を自動生成</div>
      </div>
      <div class="price">&yen;9,800/月（14日無料）</div>
      <a href="https://buy.stripe.com/7sYaEX8ts3Z01sz1obfQI06" target="_blank" class="btn">今すぐ始める</a>
    </div>
  </div>
</body>
</html>
