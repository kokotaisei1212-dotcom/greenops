<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenOps - プロジェクト分析</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5}
    .container{max-width:600px;margin:40px auto;padding:20px}
    .card{background:white;border-radius:8px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    h1{font-size:24px;margin-bottom:10px;color:#333}
    .loading{text-align:center;padding:40px}
    .spinner{display:inline-block;width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .loading p{margin-top:20px;color:#667eea;font-weight:600}
    .error{background:#ffe0e0;border:1px solid #ff4757;color:#ff4757;padding:15px;border-radius:4px;margin-top:20px;display:none}
    .result{background:#f9f9f9;padding:15px;border-radius:4px;margin-top:20px;border-left:3px solid #667eea;display:none}
    .result h2{font-size:16px;color:#333;margin-bottom:10px}
    .result-item{margin:8px 0;font-size:14px}
    .result-label{color:#666;font-weight:500}
    .result-value{color:#333;font-weight:600}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>GreenOps AI 分析</h1>
      <div class="loading" id="loading"><div class="spinner"></div><p>分析中...</p></div>
      <div class="error" id="error"></div>
      <div class="result" id="result"><h2>分析結果</h2><div id="resultContent"></div></div>
    </div>
  </div>
  <script>
    window.addEventListener('load', function(){ analyze(); });

    function analyze() {
      fetch('/api/analyze-project', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project_id: 'default_project' })
      })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.error) { showError(data.error); return; }
        displayResult(data);
      })
      .catch(function(err){ showError(err.message || 'ネットワークエラー'); })
      .finally(function(){ document.getElementById('loading').style.display = 'none'; });
    }

    function showError(msg) {
      var el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function displayResult(data) {
      var a = data.ai_analysis || {};
      var c = a.cost || {};
      var s = a.schedule || {};
      var sf = a.safety || {};
      var html = '';

      html += '<div class="result-item"><span class="result-label">赤字化確率: </span><span class="result-value">' + ((c.loss_probability || 0) * 100).toFixed(1) + '%</span></div>';
      html += '<div class="result-item"><span class="result-label">推定赤字額: </span><span class="result-value">\u00a5' + Math.floor(c.estimated_loss_yen || 0).toLocaleString() + '</span></div>';
      html += '<div class="result-item"><span class="result-label">工期遅延: </span><span class="result-value">' + (s.predicted_delay_days || 0) + '\u65e5</span></div>';
      html += '<div class="result-item"><span class="result-label">安全スコア: </span><span class="result-value">' + (sf.overall_score || 0) + '/100</span></div>';

      if (a.recommendations && a.recommendations.length > 0) {
        html += '<div style="margin-top:15px;border-top:1px solid #ddd;padding-top:10px"><span class="result-label">推奨対応:</span>';
        for (var i = 0; i < a.recommendations.length; i++) {
          html += '<div style="margin:5px 0;color:#333;font-size:13px">' + (i+1) + '. ' + a.recommendations[i] + '</div>';
        }
        html += '</div>';
      }

      document.getElementById('resultContent').innerHTML = html;
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
