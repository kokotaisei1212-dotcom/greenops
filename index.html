<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenOps - プロジェクト分析</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5}
    .container{max-width:600px;margin:40px auto;padding:20px}
    .card{background:white;border-radius:8px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
    h1{font-size:24px;margin-bottom:10px;color:#333}
    .loading{text-align:center;padding:40px}
    .spinner{display:inline-block;width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    .loading p{margin-top:20px;color:#667eea;font-weight:600}
    .result{background:#f9f9f9;padding:20px;border-radius:4px;margin-top:20px;border-left:4px solid #667eea;display:none}
    .result-item{margin:12px 0;font-size:15px}
    .result-label{color:#666;font-weight:500;display:block;margin-bottom:4px}
    .result-value{color:#333;font-weight:600;font-size:18px}
    .recommendations{margin-top:20px;border-top:1px solid #ddd;padding-top:15px}
    .rec-item{background:#f0f8ff;padding:10px;margin:8px 0;border-left:3px solid #667eea;border-radius:3px;font-size:13px}
    .error-msg{color:red;margin-top:20px}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="mainCard">
      <h1 id="title">GreenOps AI 分析</h1>
      <div class="loading" id="loading"><div class="spinner"></div><p>プロジェクトを分析中...</p></div>
      <div class="result" id="result">
        <h2 id="projectName" style="color:#333;margin-bottom:20px"></h2>
        <div class="result-item"><span class="result-label">赤字化確率</span><span class="result-value" id="lossProb">0%</span></div>
        <div class="result-item"><span class="result-label">推定赤字額</span><span class="result-value" id="lossAmount">&yen;0</span></div>
        <div class="result-item"><span class="result-label">工期遅延</span><span class="result-value" id="delay">0日</span></div>
        <div class="result-item"><span class="result-label">安全スコア</span><span class="result-value" id="safetyScore">0/100</span></div>
        <div class="recommendations"><span class="result-label">推奨対応</span><div id="recommendations"></div></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('load', function(){
      var params = new URLSearchParams(window.location.search);
      var projectId = params.get('project_id');
      if (projectId) {
        analyze(projectId);
      } else {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('title').textContent = 'エラー';
        var p = document.createElement('p');
        p.className = 'error-msg';
        p.textContent = 'プロジェクトIDが指定されていません。URLに ?project_id=xxx を追加してください。';
        document.getElementById('mainCard').appendChild(p);
      }
    });

    function analyze(projectId) {
      fetch('/api/analyze-project', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project_id: projectId })
      })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.error) throw new Error(data.error);
        displayResult(data);
      })
      .catch(function(err){
        document.getElementById('loading').style.display = 'none';
        document.getElementById('title').textContent = 'エラー';
        var p = document.createElement('p');
        p.className = 'error-msg';
        p.textContent = err.message;
        document.getElementById('mainCard').appendChild(p);
      });
    }

    function displayResult(data) {
      var a = data.ai_analysis || {};
      var c = a.cost || {};
      var s = a.schedule || {};
      var sf = a.safety || {};

      document.getElementById('projectName').textContent = 'プロジェクト: ' + data.project_id;
      document.getElementById('lossProb').textContent = ((c.loss_probability || 0) * 100).toFixed(1) + '%';
      document.getElementById('lossAmount').textContent = '\u00a5' + Math.floor(c.estimated_loss_yen || 0).toLocaleString();
      document.getElementById('delay').textContent = (s.predicted_delay_days || 0) + '\u65e5';
      document.getElementById('safetyScore').textContent = (sf.overall_score || 0) + '/100';

      var recs = a.recommendations || [];
      var html = '';
      for (var i = 0; i < recs.length; i++) {
        html += '<div class="rec-item">' + (i+1) + '. ' + recs[i] + '</div>';
      }
      document.getElementById('recommendations').innerHTML = html;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
