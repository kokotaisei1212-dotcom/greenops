<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenOps</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif;background:#fff;color:#1a1a1a}
.header{padding:20px 40px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}.logo{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.main{max-width:600px;margin:0 auto;padding:60px 40px}
.input-section{margin-bottom:80px}.section-title{font-size:24px;font-weight:700;margin-bottom:40px}
.form-group{margin-bottom:30px}.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}.form-input,.form-select{width:100%;padding:14px;border:1px solid #e0e0e0;border-radius:6px;font-size:16px;font-family:inherit;transition:border-color 0.2s}.form-input:focus,.form-select:focus{outline:none;border-color:#000}
.form-buttons{display:flex;gap:12px;margin-top:40px}.btn{flex:1;padding:14px;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s}.btn-submit{background:#000;color:#fff}.btn-submit:hover{background:#1a1a1a}.btn-reset{background:#f5f5f5;color:#000;border:1px solid #e0e0e0}.btn-reset:hover{background:#efefef}
.result{display:none;text-align:center}.result.show{display:block}
.margin-box{background:#f9f9f9;border:2px solid #e0e0e0;border-radius:12px;padding:60px 40px;margin-bottom:40px}.margin-label{font-size:14px;color:#999;margin-bottom:20px;text-transform:uppercase;letter-spacing:0.5px}.margin-value{font-size:56px;font-weight:700;margin-bottom:20px}.margin-status{font-size:16px;font-weight:600;padding:12px 20px;border-radius:6px;display:inline-block;margin-bottom:30px}
.status-safe{background:#d4edda;color:#155724}.status-warning{background:#fff3cd;color:#856404}.status-danger{background:#f8d7da;color:#721c24}
.result-details{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px}.detail{padding:20px;background:#f9f9f9;border-radius:6px}.detail-label{font-size:12px;color:#999;margin-bottom:8px}.detail-value{font-size:20px;font-weight:700}
.alert{background:#fff3cd;border-left:4px solid #ffc107;padding:20px;border-radius:6px;margin-bottom:40px;display:none;text-align:left}.alert.show{display:block}.alert-title{font-weight:600;color:#856404;margin-bottom:8px}.alert-message{font-size:14px;color:#856404}
.trend{margin-top:40px;padding-top:40px;border-top:1px solid #e0e0e0}.trend-title{font-size:14px;color:#999;margin-bottom:20px;text-transform:uppercase;letter-spacing:0.5px}.trend-bars{display:flex;gap:8px;align-items:flex-end;height:100px}.trend-bar{flex:1;background:#f0f0f0;border-radius:4px 4px 0 0;min-height:20px}.trend-bar.positive{background:#2ecc71}.trend-bar.negative{background:#e74c3c}
.back-button{text-align:center;margin-top:40px}.back-button button{background:#f5f5f5;color:#000;border:1px solid #e0e0e0;padding:12px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
@media(max-width:768px){.main{padding:40px 20px}.header{padding:20px}.result-details{grid-template-columns:1fr}.margin-value{font-size:40px}}
</style>
</head>
<body>
<div class="header"><div class="logo">GreenOps</div></div>
<div class="main">
<div class="input-section" id="inputSection">
<div class="section-title">本日の工事状況</div>
<div class="form-group"><label class="form-label">工事</label><select class="form-select" id="projectSelect"><option value="">工事を選択</option></select></div>
<div class="form-group"><label class="form-label">本日の人数</label><input type="number" class="form-input" id="workers" placeholder="8" min="0" max="50"></div>
<div class="form-group"><label class="form-label">進捗</label><input type="number" class="form-input" id="progress" placeholder="65" min="0" max="100"><span style="font-size:12px;color:#999">%</span></div>
<div class="form-group"><label class="form-label">天候</label><select class="form-select" id="weather"><option value="晴">晴</option><option value="曇">曇</option><option value="雨">雨</option><option value="雪">雪</option></select></div>
<div class="form-group"><label class="form-label">追加工事</label><input type="number" class="form-input" id="extra" placeholder="0" min="0" max="500"><span style="font-size:12px;color:#999">万円</span></div>
<div class="form-buttons"><button class="btn btn-submit" onclick="calculate()">粗利を計算</button><button class="btn btn-reset" onclick="reset()">リセット</button></div>
</div>
<div class="result" id="resultSection">
<div class="alert" id="alertBox"><div class="alert-title" id="alertTitle"></div><div class="alert-message" id="alertMessage"></div></div>
<div class="margin-box"><div class="margin-label">推定粗利</div><div class="margin-value" id="marginValue">+285万</div><div class="margin-status" id="marginStatus">安全圏</div></div>
<div class="result-details"><div class="detail"><div class="detail-label">粗利率</div><div class="detail-value" id="detailRate">23.8%</div></div><div class="detail"><div class="detail-label">見込支出</div><div class="detail-value" id="detailExpense">915万</div></div><div class="detail"><div class="detail-label">予算残</div><div class="detail-value" id="detailLeft">285万</div></div></div>
<div class="trend"><div class="trend-title">7日間トレンド</div><div class="trend-bars" id="trendBars"></div></div>
<div class="back-button"><button onclick="backToInput()">新規入力</button></div>
</div>
</div>
<script>
var projects=[{name:'ビル改修',budget:1200},{name:'商業施設内装',budget:780},{name:'リノベーション',budget:380},{name:'事務所改修',budget:520}];
var trendData=[12,18,15,22,19,25,23];
var sel=document.getElementById('projectSelect');
projects.forEach(function(p){var o=document.createElement('option');o.value=p.name;o.text=p.name;sel.appendChild(o)});

function calculate(){
var pn=document.getElementById('projectSelect').value,w=parseInt(document.getElementById('workers').value)||0,pr=parseInt(document.getElementById('progress').value)||0,wt=document.getElementById('weather').value,ex=parseInt(document.getElementById('extra').value)||0;
if(!pn||!w||!pr){alert('\u3059\u3079\u3066\u306e\u9805\u76ee\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044');return}
var p=projects.find(function(x){return x.name===pn});
var wf=wt==='\u96e8'?0.8:wt==='\u96ea'?0.6:1.0;
var be=(p.budget*pr/100)*0.7,ae=be*wf,te=ae+(ex>0?ex*0.3:0),m=(p.budget*(pr/100))-te,mr=(m/(p.budget*(pr/100)))*100;
var mv=document.getElementById('marginValue'),ms=document.getElementById('marginStatus'),ab=document.getElementById('alertBox');
if(m>=50){mv.textContent='+'+Math.round(m)+'\u4e07';mv.style.color='#2ecc71';ms.className='margin-status status-safe';ms.textContent='\u5b89\u5168';ab.classList.remove('show')}
else if(m>=0){mv.textContent='+'+Math.round(m)+'\u4e07';mv.style.color='#f39c12';ms.className='margin-status status-warning';ms.textContent='\u8981\u78ba\u8a8d';showAlert('\u6ce8\u610f',pr>70?'\u3042\u30683\u9031\u9593\u4ee5\u5185\u306b\u5bfe\u5fdc\u304c\u5fc5\u8981':'\u9032\u6357\u306b\u6ce8\u610f')}
else{mv.textContent=Math.round(m)+'\u4e07';mv.style.color='#e74c3c';ms.className='margin-status status-danger';ms.textContent='\u8d64\u5b57';showAlert('\u8b66\u544a','\u672c\u793e\u306b\u5831\u544a\u3057\u3066\u304f\u3060\u3055\u3044')}
document.getElementById('detailRate').textContent=Math.round(mr*10)/10+'%';
document.getElementById('detailExpense').textContent=Math.round(te)+'\u4e07';
document.getElementById('detailLeft').textContent=Math.round(m)+'\u4e07';
renderTrend();
document.getElementById('inputSection').style.display='none';
document.getElementById('resultSection').classList.add('show');
}
function showAlert(t,m){document.getElementById('alertTitle').textContent=t;document.getElementById('alertMessage').textContent=m;document.getElementById('alertBox').classList.add('show')}
function renderTrend(){var tb=document.getElementById('trendBars');tb.innerHTML='';var mx=Math.max.apply(null,trendData);trendData.forEach(function(v){var b=document.createElement('div');b.className='trend-bar '+(v>=20?'positive':'negative');b.style.height=(v/mx*100)+'px';tb.appendChild(b)})}
function backToInput(){document.getElementById('inputSection').style.display='block';document.getElementById('resultSection').classList.remove('show');reset()}
function reset(){document.getElementById('projectSelect').value='';document.getElementById('workers').value='';document.getElementById('progress').value='';document.getElementById('weather').value='\u6674';document.getElementById('extra').value=''}
</script>
</body>
</html>
